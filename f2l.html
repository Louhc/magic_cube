<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F2L 公式合集</title>
<link rel="icon" type="image/x-icon" href="cube-64x64.ico">
<style>
  /* 默认浅色（白底）；点右上角按钮切夜晚。不跟随系统 —— 这是打印/速查用的表。 */
  :root{
    color-scheme: light;
    --bg:#eef1f6; --card:#ffffff;   /* 页面底压暗一档，卡片保持白 -> 靠层次降低刺眼感 */ --line:#d8dee7; --line-strong:#b9c3d0;
    --text:#1e2530; --muted:#6a7686; --head-red:#c0392b; --head-green:#1e8449;
    --head-band:#f7d9b6; --accent:#2f6bd8; --field:#f4f6f9;
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --bg:#151a22; --card:#1b222c; --line:#2a3340; --line-strong:#3a4553;
    --text:#e7edf5; --muted:#8a98aa; --head-red:#e05a4a; --head-green:#3fbf74;
    --head-band:#3a2f22; --accent:#5b9bff; --field:#222a35;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:relative;padding:22px 20px 8px;text-align:center}
  .themebtn{position:absolute;right:16px;top:16px;width:34px;height:34px;padding:0;
            border-radius:9px;background:var(--field);border:1px solid var(--line);
            color:var(--text);font-size:15px;line-height:1;cursor:pointer;transition:.12s}
  .themebtn:hover{border-color:var(--line-strong)}
  h1{margin:0;font-size:20px;letter-spacing:.02em}
  header p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
  main{max-width:1180px;margin:0 auto;padding:10px 16px 60px}

  section{margin:26px 0 0;background:var(--card);border:1px solid var(--line);
          border-radius:12px;overflow:hidden}
  section > h2{margin:0;padding:11px 16px;font-size:14px;font-weight:600;
               background:var(--head-band);border-bottom:1px solid var(--line)}
  section > h2 .cnt{float:right;color:var(--muted);font-weight:400;font-size:12.5px}

  table{width:100%;border-collapse:collapse;table-layout:fixed}
  col.side{width:110px}
  col.formula{width:auto}
  th{padding:9px 12px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line);
     border-right:1px solid var(--line);background:var(--field)}
  th.red{color:var(--head-red)} th.green{color:var(--head-green)}
  th:last-child{border-right:none}
  td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle}
  td:last-child{border-right:none}
  tr:last-child td{border-bottom:none}
  /* 图片是透明底 PNG，这一格就不铺底色，整页保持纯白 */
  td.pic{padding:6px;text-align:center}
  td.pic .box{position:relative;display:inline-block;line-height:0}
  /* 给图片预留高度（F2L 的图是 512x515），否则懒加载完成后整行会被撑高 */
  td.pic img{width:96px;height:auto;aspect-ratio:512/515;display:block;margin:0 auto;
             image-rendering:auto;border-radius:6px}
  /* 编号角标，和 oll/pll 一致 */
  td.pic .no{position:absolute;left:3px;top:1px;font-size:11px;font-weight:600;
             color:var(--muted);line-height:1;background:#ffffffb3;
             padding:1px 3px;border-radius:4px}
  html[data-theme="dark"] td.pic .no{background:#00000080}
  td.f{padding:10px 14px}
  td.empty{background:var(--field)}

  /* 公式：等宽，点一下复制 */
  code{font:13.5px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
       cursor:pointer;word-break:break-word;border-radius:5px;padding:2px 5px;margin:-2px -5px}
  code:hover{background:var(--field)}
  code.copied{background:var(--accent);color:#fff}
  /* 「在计算器里打开」：把公式带过去，省得手抄 */
  a.tocalc{flex:none;display:inline-block;margin-left:7px;padding:2px 7px;border-radius:5px;
           text-decoration:none;font:11.5px/1.5 ui-monospace,Menlo,monospace;
           color:var(--muted);background:var(--field);border:1px solid var(--line);
           transition:.12s}
  a.tocalc:hover{color:var(--accent);border-color:var(--accent)}
  .fw{display:flex;flex-wrap:wrap;align-items:baseline;margin:2px 0}

  /* 复制提示 */
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
         background:#111a;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;
         opacity:0;pointer-events:none;transition:.18s}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:720px){
    col.side{width:78px}
    td.pic img{width:64px}
    td.f{padding:8px 10px}
    code{font-size:12.5px}
  }
  @media print{
    html[data-theme]{--bg:#fff;--card:#fff;--text:#000;--field:#f4f6f9}
    body{background:#fff;color:#000}
    .themebtn{display:none}
    header{padding:0 0 8px}
    section{break-inside:avoid;border-color:#999}
    code:hover{background:none}
    #toast{display:none}
  }
</style>
<link rel="stylesheet" href="nav.css">
<script>/* 主题必须在首次绘制前定好，否则会先用浅色画一遍再翻深色（闪一下） */
try{if(localStorage.getItem('cube-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>

<script src="nav.js"></script>
<header>
  <h1>F2L</h1>
  <button class="themebtn" id="themebtn" type="button" title="切到夜晚">☾</button>
</header>

<main id="app"></main>

<div id="toast"></div>

<script>
/* 数据：三节，每节若干行；每行左右两格（左=a 红色为F面，右=b 绿色为F面）。
   图片取自 f2l/ 目录，文件名形如 f2l-01a-512x515.png。
   公式严格照原表誊录（含原表的 U'2 / L'2 这类写法）。 */
var SECTIONS = [
  {
    title: '需要特殊处理的几种情况',
    rows: [
      { a: '01a', b: '01b',
        af: "(R U' R' U)(R U' R' U2)(R U' R')",
        bf: "(L' U L U')(L' U L U2)(L' U L)" },
      { a: '02a', b: '02b',
        af: "(l U)(L F' L' U' l')",
        bf: "(r' U')(R' F R U r)" },
      { a: '03a', b: '03b',
        af: "(R2 U'2)(R' U' R U')(R' U2 R')",
        bf: "(L'2 U2)(L U L' U')(L U2 L)" },
      { a: '04a', b: '04b',
        af: "(R U' R' F')(L' U'2 L F)",
        bf: "(L' U L F)(R U2 R' F')" },
      { a: '05a', b: '05b',
        af: "(R U R' U')(R U R')",
        bf: "(L' U' L U)(L' U' L)" },
      { a: '06a', b: '06b',
        af: "(R U)(R2 F R F')",
        bf: "(L' U)(L2 F' L' F)" },
      // 这一行左格有两条公式，右格为空
      { a: '07', b: null,
        af: "(R U R' U2)(R U2 R' U)y'(R' U R)\n(R' F R F')(R U' R' U)(R U' R' U2 R U' R')",
        bf: null }
    ]
  },
  {
    title: '白色朝上的情况',
    rows: [
      { a: '08', b: null, af: "(R U R' U')(R U R' U')(R U R')", bf: null },
      { a: '09', b: null, af: "(R U' R' U)y(L' U L)", bf: null },
      { a: '10a', b: '10b',
        af: "(R U' R' U2)(R U R' U')(R U' R')",
        bf: "(L' U' L U2)(L' U' L U)(L' U' L)" },
      { a: '11a', b: '11b',
        af: "(R U2 R' U')(R U R')",
        bf: "(L' U2 L U)(L' U' L)" },
      { a: '12a', b: '12b',
        af: "(R U' R' U2)(R U R')",
        bf: "(L' U' L U2)(L' U' L)" },
      { a: '13a', b: '13b',
        af: "U(R U'2 R' U)(R U' R')",
        bf: "U'(L' U2 L U')(L' U' L)" }
    ]
  },
  {
    title: '简单情况',
    rows: [
      { a: '14a', b: '14b', af: "(R U R')", bf: "(L' U' L)" },
      { a: '15a', b: '15b',
        af: "U'(R U' R' U)(R U R')",
        bf: "U(L' U L U')(L' U' L)" },
      { a: '16a', b: '16b',
        af: "U'(R U R' U)(R U R')",
        bf: "U(L' U' L U')(L' U' L)" },
      { a: '17a', b: '17b', af: "(U R U' R')", bf: "(U' L' U L)" },
      { a: '18a', b: '18b',
        af: "U'(R U R' U2)(R U' R')",
        bf: "U(L' U' L U2)(L' U L)" },
      { a: '19a', b: '19b',
        af: "U'(R U2 R' U2)(R U' R')",
        bf: "U(L' U2 L U2)(L' U L)" },
      { a: '20a', b: '20b',
        af: "U'(R U' R' U2)(R U' R')",
        bf: "U(L' U' L U2)(L' U L)" },
      { a: '21a', b: '21b',
        af: "(U' R U R')y(U L' U' L)",
        bf: "(U L' U' L)y'(U' R U R')" }
    ]
  }
];

var IMG = function (name) { return 'f2l/f2l-' + name + '-512x515.png'; };

function esc(s) {
  return String(s).replace(/[&<>]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
  });
}
/* 一行里可能有多条公式（换行分隔），逐条渲染成可点的 code */
function toCalc(alg) {
  return '<a class="tocalc" href="calc.html#' + encodeURIComponent(alg) +
         '" title="在计算器里打开这条公式">\u2197</a>';
}
function formulas(text) {
  if (!text) return '';
  return text.split('\n').map(function (line) {
    return '<span class="fw"><code>' + esc(line) + '</code>' + toCalc(line) + '</span>';
  }).join('');
}
function pic(name, alt) {
  if (!name) return '<td class="empty"></td>';
  // 角标去掉前导 0（01a -> 1a）；文件名不能动，磁盘上就叫 01a
  var label = name.replace(/^0+/, '');
  return '<td class="pic"><span class="box"><img src="' + IMG(name) + '" alt="' +
         esc(alt) + '" loading="lazy"><span class="no">' + esc(label) +
         '</span></span></td>';
}

var html = '';
SECTIONS.forEach(function (sec) {
  html += '<section><h2>' + esc(sec.title) +
          '<span class="cnt">' + sec.rows.length + '</span></h2><table>' +
          '<colgroup><col class="side"><col class="formula">' +
          '<col class="side"><col class="formula"></colgroup>' +
          '<thead><tr>' +
          '<th class="red">红 F</th><th></th>' +
          '<th class="green">绿 F</th><th></th>' +
          '</tr></thead><tbody>';
  sec.rows.forEach(function (r) {
    html += '<tr>' +
      pic(r.a, r.af) + '<td class="f">' + formulas(r.af) + '</td>' +
      pic(r.b, r.bf) + '<td class="f">' + formulas(r.bf) + '</td>' +
      '</tr>';
  });
  html += '</tbody></table></section>';
});
document.getElementById('app').innerHTML = html;
/* 夜晚模式 */
var root = document.documentElement, themeBtn = document.getElementById('themebtn');
function applyTheme(t) {
  root.dataset.theme = t;
  themeBtn.textContent = t === 'dark' ? '\u2600' : '\u263e';
  themeBtn.title = t === 'dark' ? '切到白天' : '切到夜晚';
  try { localStorage.setItem('cube-theme', t); } catch (e) {}
}
var saved = null;
try { saved = localStorage.getItem('cube-theme'); } catch (e) {}
applyTheme(saved === 'dark' ? 'dark' : 'light');
themeBtn.addEventListener('click', function () {
  applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
});

/* 点公式复制 */
var toastEl = document.getElementById('toast'), toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 1400);
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(text); }
  catch (e) { toast('复制失败，请手动选择'); }
  ta.remove();
}
document.getElementById('app').addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('code') : null;
  if (!el) return;
  var text = el.textContent;
  // 去掉公式里的空格，粘进播放器/脚本更省事
  var compact = text.replace(/\s+/g, '');
  function done() {
    el.classList.add('copied');
    setTimeout(function () { el.classList.remove('copied'); }, 600);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(compact).then(function () { done(); toast(compact); },
                                                function () { fallbackCopy(compact); done(); });
  } else {
    fallbackCopy(compact); done();
  }
});
</script>
</body>
</html>
