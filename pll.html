<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLL 公式合集</title>
<link rel="icon" type="image/x-icon" href="cube-64x64.ico">
<style>
  /* 固定浅色：白底。不跟随系统深色模式 —— 这是一张打印/速查用的表。 */
  :root{
    color-scheme: light;
    --bg:#ffffff; --card:#ffffff; --line:#d8dee7; --line-strong:#b9c3d0;
    --text:#1e2530; --muted:#6a7686; --head-red:#c0392b; --head-green:#1e8449;
    --head-band:#f7d9b6; --accent:#2f6bd8; --field:#f4f6f9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:22px 20px 8px;text-align:center}
  h1{margin:0;font-size:20px;letter-spacing:.02em}
  header p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
  main{max-width:1180px;margin:0 auto;padding:10px 16px 60px}

  section{margin:26px 0 0;background:var(--card);border:1px solid var(--line);
          border-radius:12px;overflow:hidden}
  section > h2{margin:0;padding:11px 16px;font-size:14px;font-weight:600;
               background:var(--head-band);border-bottom:1px solid var(--line)}

  table{width:100%;border-collapse:collapse;table-layout:fixed}
  col.side{width:110px}
  col.formula{width:auto}
  th{padding:9px 12px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line);
     border-right:1px solid var(--line);background:var(--field)}
  th.red{color:var(--head-red)} th.green{color:var(--head-green)}
  th:last-child{border-right:none}
  td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle}
  td:last-child{border-right:none}
  tr:last-child td{border-bottom:none}
  /* 图片是透明底 PNG，这一格就不铺底色，整页保持纯白 */
  td.pic{padding:6px;text-align:center}
  td.pic img{width:96px;height:auto;display:block;margin:0 auto;
             image-rendering:auto;border-radius:6px}
  td.f{padding:10px 14px}
  td.empty{background:var(--field)}

  /* 公式：等宽，点一下复制 */
  code{font:13.5px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
       cursor:pointer;word-break:break-word;border-radius:5px;padding:2px 5px;margin:-2px -5px}
  code:hover{background:var(--field)}
  code.copied{background:var(--accent);color:#fff}

  /* 复制提示 */
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
         background:#111a;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;
         opacity:0;pointer-events:none;transition:.18s}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:720px){
    col.side{width:78px}
    td.pic img{width:64px}
    td.f{padding:8px 10px}
    code{font-size:12.5px}
  }
  @media print{
    body{background:#fff;color:#000}
    header{padding:0 0 8px}
    section{break-inside:avoid;border-color:#999}
    code:hover{background:none}
    #toast{display:none}
  }
  .todo{color:var(--muted);font-size:12.5px;font-style:italic}
</style>
</head>
<body>
<header>
  <h1>PLL 公式合集</h1>
  <p>共 21 个情况。点公式即可复制。</p>
</header>
<main id="app"></main>
<div id="toast"></div>
<script>
/* 数据：每节若干情况，每条 = [编号, 公式, 名称(可选)]。
   图片取自 pll/ 目录。公式来自知乎「小狼啊小狼」系列；
   朝向与图不符的已换成朝向吻合的公式，仍找不到的留空（公式为空串）。 */
var SECTIONS = [
  { title: "21 种情况", cnt: 21, rows: [
    [1, "(R U' R) (U R) (U R U' R' U' R'2)", "三棱换"],
    [2, "(R2 U) (R U R' U' R' U') (R' U R')", "三棱换"],
    [3, "x' R2 D2 (R' U' R) D2 (R' U R')", "三角换"],
    [4, "x' (R U' R) D2 (R' U R) D2 R'2", "三角换"],
    [5, "M'2 U M'2 U2 M'2 U M'2", "对棱换"],
    [6, "", "邻棱换"],
    [7, "x' (R U' R' D) (R U R' D') (R U R' D) (R U' R' D')", "邻角换"],
    [8, "(R U R' U') (R' F R2 U' R' U') (R U R' F')", "邻角对棱换"],
    [9, "R' U' F' (R U R' U' R' F R2 U' R' U' R U R' F') F U R", "邻角对棱换"],
    [10, "R' U R' d' R' F' R2 U' R' U R' F R F", "对角邻棱换"],
    [11, "F (R U' R' U' R U R') F' (R U R' U') (R' F R F')", "对角邻棱换"],
    [12, "R' U R U' R' F' U' F R U R' F R' F' R U' R", "对角对棱换"],
    [13, "R U R' U (R U R' F' R U R' U' R' F R2 U' R' U') U' R U' R'", "对角对棱换"],
    [14, "(R U R' F') (R U R' U') (R' F) (R2 U' R' U')", "邻角邻棱换"],
    [15, "(L' U' L F) (L' U' L U) (L F') (L2 U L U)", "邻角邻棱换"],
    [16, "(R U R' F') (R U'2 R' U2) (R' F R U) (R U'2 R' U')", "邻角邻棱换"],
    [17, "(L' U' L F) (L' U2 L U'2) (L F' L' U') (L' U2 L U)", "邻角邻棱换"],
    [18, "(R'2 u' R U' R) (U R' u R2) y (R U' R')", "三角三棱换"],
    [19, "(R U R') y' (R'2 u' R U') (R' U R' u R2)", "三角三棱换"],
    [20, "(R2 u) (R' U R' U' R u' R'2) y' (R' U R)", "三角三棱换"],
    [21, "(R' U' R) y (R2 u) (R' U R U') (R u' R'2)", "三角三棱换"],
  ] },
];

var IMG = function (n) {
  return 'pll/pll-' + (n < 10 ? '0' + n : n) + '-512x512.png';
};
function esc(s) {
  return String(s).replace(/[&<>]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
  });
}
function pic(n) {
  return '<td class="pic"><span class="box"><img src="' + IMG(n) + '" alt="' + n +
         '" loading="lazy"><span class="no">' + n + '</span></span></td>';
}
function fcell(alg, name) {
  var body = alg ? '<code>' + esc(alg) + '</code>'
                 : '<span class="todo">朝向与图不符，暂缺</span>';
  return '<td class="f">' + (name ? '<span class="nm">' + esc(name) + '</span>' : '') +
         body + '</td>';
}
var html = '';
SECTIONS.forEach(function (sec) {
  html += '<section><h2>' + esc(sec.title) +
          '<span class="cnt">' + sec.cnt + ' 个</span></h2><table>' +
          '<colgroup><col class="pic"><col class="f"><col class="pic"><col class="f"></colgroup><tbody>';
  for (var i = 0; i < sec.rows.length; i += 2) {
    var a = sec.rows[i], b = sec.rows[i + 1];
    html += '<tr>' + pic(a[0]) + fcell(a[1], a[2]);
    html += b ? pic(b[0]) + fcell(b[1], b[2])
              : '<td class="empty"></td><td class="empty"></td>';
    html += '</tr>';
  }
  html += '</tbody></table></section>';
});
document.getElementById('app').innerHTML = html;

var toastEl = document.getElementById('toast'), toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 1400);
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('已复制：' + text); }
  catch (e) { toast('复制失败，请手动选择'); }
  ta.remove();
}
document.getElementById('app').addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('code') : null;
  if (!el) return;
  var compact = el.textContent.replace(/\s+/g, '');
  function done() { el.classList.add('copied');
    setTimeout(function () { el.classList.remove('copied'); }, 600); }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(compact).then(function () { done(); toast('已复制：' + compact); },
                                                function () { fallbackCopy(compact); done(); });
  } else { fallbackCopy(compact); done(); }
});
</script>
</body>
</html>
