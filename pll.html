<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLL 公式合集</title>
<link rel="icon" type="image/x-icon" href="cube-64x64.ico">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="nav.css">
<script>/* 主题必须在首次绘制前定好，否则会先用浅色画一遍再翻深色（闪一下） */
try{if(localStorage.getItem('cube-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<style>
  /* 默认浅色（白底）；点右上角按钮切夜晚。不跟随系统 —— 这是打印/速查用的表。
     两套主题的所有颜色变量都在 theme.css 里，这里只管版式。 */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:relative;padding:22px 20px 8px;text-align:center}
  h1{margin:0;font-size:20px;letter-spacing:.02em}
  header p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
  /* 「显示颜色」开关：摆在右上角、主题开关的正下方（16 + 28 + 12 = 56） */
  .opts{position:absolute;right:16px;top:56px;display:flex;justify-content:flex-end}
  /* 开关（显示颜色 / 跳过动画 / 明暗…）：一条轨道 + 一个滑块，和主题开关同一套语言。
     真勾选框藏起来（视觉由 .on 决定），但保留键盘可达性：Tab 能走到，:focus-within 给焦点圈。 */
  .tg{position:relative;display:inline-flex;align-items:center;padding:1px 0 1px 44px;
      cursor:pointer;color:var(--muted);font-size:12.5px;user-select:none;
      transition:color .12s ease}
  .tg input{position:absolute;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
  .tg::before{content:'';position:absolute;left:0;top:50%;width:36px;height:20px;margin-top:-10px;
              box-sizing:border-box;border-radius:10px;background:var(--line);
              border:1px solid var(--line-strong);
              transition:background .15s ease,border-color .15s ease}
  .tg::after{content:'';position:absolute;left:2px;top:50%;width:16px;height:16px;margin-top:-8px;
             border-radius:50%;background:var(--panel);box-shadow:0 1px 3px #00000033;
             transition:transform .18s cubic-bezier(.34,.86,.32,1),background .15s ease}
  .tg:hover,.tg.on{color:var(--text)}
  .tg.on::before{background:var(--accent);border-color:var(--accent)}
  .tg.on::after{transform:translateX(16px);background:var(--on-accent, #fff)}
  .tg:focus-within::before{outline:2px solid var(--accent-text);outline-offset:2px}
  /* 只管位置 —— 开关本身的样式（尺寸/底色/滑块）在 nav.css 里，七页共用 */
  .themebtn{position:absolute;right:16px;top:16px}
  /* 打印：只留按钮，样式交给下面 @media print 里那套白底黑字 */
  .printbtn{position:absolute;right:80px;top:16px;width:28px;height:28px;padding:0;
            border-radius:8px;background:var(--field);border:1px solid var(--line);
            color:var(--muted);cursor:pointer;display:grid;place-items:center;
            transition:color .12s,border-color .12s}
  .printbtn:hover{color:var(--accent-text);border-color:var(--accent-text)}
  .printbtn svg{width:15px;height:15px;display:block;fill:none;stroke:currentColor;
                stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  main{max-width:880px;margin:0 auto;padding:10px 16px 60px}

  section{margin:26px 0 0;background:var(--card);border:1px solid var(--line);
          border-radius:12px;overflow:hidden}
  section > h2{margin:0;padding:11px 16px;font-size:14px;font-weight:600;
               background:var(--head-band);border-bottom:1px solid var(--line)}
  section > h2 .cnt{float:right;color:var(--muted);font-weight:400;font-size:12.5px}

  table{width:100%;border-collapse:collapse;table-layout:fixed}
  col.pic{width:116px}
  th{padding:9px 12px;font-size:12.5px;font-weight:600;text-align:left;
     border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:var(--chip)}
  th:last-child{border-right:none}
  td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle}
  td:last-child{border-right:none}
  tr:last-child td{border-bottom:none}
  /* 图是透明底 PNG，这一格不铺底色，跟随页面底色 */
  td.pic{padding:6px;text-align:center}
  td.pic .box{position:relative;display:inline-block;line-height:0}
  /* 给图片预留高度：图片是懒加载的，不写 aspect-ratio 的话
     加载完成前高度为 0，加载后整行会被撑高 —— 也是一次跳动 */
  td.pic img{width:100px;height:auto;aspect-ratio:1/1;display:block;border-radius:6px}
  td.pic .no{position:absolute;left:3px;top:1px;font-size:11px;font-weight:600;
             color:var(--muted);line-height:1;background:var(--badge);padding:1px 3px;border-radius:4px}
  td.f{padding:11px 14px}
  td.empty{background:var(--chip)}
  .todo{color:var(--muted);font-size:12.5px;font-style:italic}

  code{font:13.5px/1.75 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
       cursor:pointer;word-break:break-word;border-radius:5px;padding:2px 5px;margin:-2px -5px}
  code:hover{background:var(--chip)}
  code.copied{background:var(--accent);color:var(--on-accent, #fff)}
  /* 「在计算器里打开」：把公式带过去，省得手抄。
     一列里几十个这种钮，常亮会抢公式的戏 —— 平时只留一个淡淡的计算器图标，
     指到哪一行（或指到按钮本身）才亮成实心圆钮。 */
  a.tocalc{flex:none;display:inline-flex;align-items:center;justify-content:center;
           width:20px;height:20px;margin-left:8px;border-radius:50%;
           color:var(--muted);background:transparent;border:1px solid transparent;
           opacity:.55;text-decoration:none;
           transition:opacity .14s,color .14s,background .14s,border-color .14s,
                      transform .14s,box-shadow .14s}
  a.tocalc svg{width:13px;height:13px;display:block}
  tr:hover a.tocalc,a.tocalc:hover,a.tocalc:focus-visible{opacity:1}
  a.tocalc:hover,a.tocalc:focus-visible{color:var(--on-accent, #fff);background:var(--accent);
           border-color:var(--accent);transform:translateY(-1px);box-shadow:0 2px 7px #00000026}
  @media (hover:none){a.tocalc{opacity:1}}
  /* 注意：不要在 td 上用 display:flex —— 单元格会不再是 table-cell，
     行高和列宽随之全乱。让公式和按钮自然内联排即可。 */
  td.f code{vertical-align:middle}
  td.f a.tocalc{vertical-align:middle}

  /* 图片点一下看大图：光标（放大镜）和悬停那圈边由 nav.css 的 img[data-zoom] 负责 */

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
         background:#111c;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;
         opacity:0;pointer-events:none;transition:.18s}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:720px){
    col.pic{width:86px}
    td.pic img{width:72px}
    td.f{padding:8px 10px}
    code{font-size:12.5px}
  }
  @media print{
    body{background:#fff;color:#000}
    /* 打印分页：卡片别拦着分页 —— break-inside:avoid + overflow:hidden 会让整张表
       变成「不可拆分的一块」，这一页装不下就整节推到下一页，标题也跟着单独占一页。
       现在让表格跨页接着排，只禁止「一行被劈成两半」；标题不落在页尾当孤儿。 */
    main{padding:0}
    header{padding:0 0 6px;break-after:avoid}
    section{break-inside:auto;overflow:visible;border-radius:0;border-color:#999;margin:10px 0 0}
    section > h2{break-after:avoid;border-radius:0}
    tr{break-inside:avoid}
    /* 打印：纸上比屏幕费眼 —— 表格框线加粗、公式文字调大 */
    table{border:2px solid #333}
    th,td{border:1px solid #333}
    th{border-bottom-width:2px}
    code{font-size:15px;font-weight:600}
    .themebtn,.printbtn,.opts{display:none}
    a.tocalc{display:none}
    code:hover{background:none}
    #toast{display:none}
  }
</style>
</head>
<body>
<script src="nav.js"></script>
<header>
  <h1>PLL</h1>
  <button class="themebtn" id="themebtn" type="button" title="切到夜晚"></button>
  <button class="printbtn" id="printbtn" type="button" title="打印 / 存成 PDF"
          aria-label="打印"><svg viewBox="0 0 24 24"><path d="M7 10.5V4h10v6.5"/><path
    d="M7 18.5H5.2A2.2 2.2 0 0 1 3 16.3v-3.6a2.2 2.2 0 0 1 2.2-2.2h13.6A2.2 2.2 0 0 1 21 12.7v3.6a2.2 2.2 0 0 1-2.2 2.2H17"/><path
    d="M7 14.5h10v6H7z"/></svg></button>
  <!-- 图里的侧面颜色：关掉只剩描边+箭头（和编辑器里的「仅箭头」是一回事）。
       自带一套无彩色的图，切开关只换图片地址，不重画。 -->
  <div class="opts">
    <label class="tg" id="tg-colors" title="关掉后图上只留描边和箭头">
      <input type="checkbox" id="showcolors" checked> 显示颜色
    </label>
  </div>
</header>
<main id="app"></main>
<div id="toast"></div>
<script>
/* 数据：每节若干情况，每条 = [编号, 公式]。公式为空串表示留空。
   图片取自 pll/ 目录。公式来自知乎「小狼啊小狼」系列，
   逐条用 tools/verify.py 校验过「照图摆好直接就能用」。 */
var SECTIONS = [
  { "title": "21 种", "cnt": 21, "rows": [
    ["Aa", "x' R2 D2 (R' U' R) D2 (R' U R')"],
    ["Ab", "x' (R U' R) D2 (R' U R) D2 R'2"],
    ["E", "x' (R U' R' D) (R U R' D') (R U R' D) (R U' R' D')"],
    ["F", "R' U' F' (R U R' U' R' F R2 U' R' U' R U R' F') F U R"],
    ["Ga", "D' R2 U R' U R' U' R U' R2 U' D R' U R U\n(R2 u) (R' U R' U' R u' R'2) y' (R' U R)"],
    ["Gb", "(R' d' F) (R2 u) (R' U) (R U' R u' R2)\n(R' U' R) y (R2 u) (R' U R U') (R u' R'2)"],
    ["Gc", "(R2 U') (R U' R U R' U R2 U D') (R U' R') D U'\n(R'2 u' R U' R) (U R' u R2) y (R U' R')"],
    ["Gd", "(R U R') (U' D) (R2 U' R U' R' U R' U R2 D') U\n(R U R') y' (R'2 u' R U') (R' U R' u R2)"],
    ["H", "M'2 U M'2 U2 M'2 U M'2"],
    ["Ja", "(L' U' L F) (L' U' L U) (L F') (L2 U L U)"],
    ["Jb", "(R U R' F') (R U R' U') (R' F) (R2 U' R' U')"],
    ["Na", "R U R' U (R U R' F' R U R' U' R' F R2 U' R' U') U' R U' R'"],
    ["Nb", "R' U R U' R' F' U' F R U R' F R' F' R U' R"],
    ["Ra", "(R U R' F') (R U'2 R' U2) (R' F R U) (R U'2 R' U')\nR U' R' U' R U R D R' U' R D' R' U2 R' U'"],
    ["Rb", "(L' U' L F) (L' U2 L U'2) (L F' L' U') (L' U2 L U)"],
    ["T", "(R U R' U') (R' F R2 U' R' U') (R U R' F')"],
    ["Ua", "(R U' R) (U R) (U R U' R' U' R'2)\nM2 U M U2 M' U M2"],
    ["Ub", "(R2 U) (R U R' U' R' U') (R' U R')\nM2 U' M U2 M' U' M2"],
    ["V", "R' U R' d' R' F' R2 U' R' U R' F R F"],
    ["Y", "F (R U' R' U' R U R') F' (R U R' U') (R' F R F')"],
    ["Z", "U (R' U' R U') (R U R U') (R' U R U) (R2 U' R' U)\nM' U' M2 U' M2 U' M' U'2 M2 U"]
  ] }
];

/* 「显示颜色」开关：有个存档键记着，默认开。
   关掉时用另一套图（-nc-）—— 同一张图去掉顶面填充和侧面颜色，只留描边和箭头。 */
var COLOR_KEY = 'pll-color-v1';
var showColors = true;
try { showColors = localStorage.getItem(COLOR_KEY) !== '0'; } catch (e) {}

var IMG = function (id) {
  // 编号统一是字符串：OLL 是 '1'..'57'（文件名补零成 01），PLL 是 'Aa'..'Z'
  var f = /^\d+$/.test(id) && id.length < 2 ? '0' + id : id;
  // 只有「不显示颜色」时才分昼夜：那种图里箭头落在深色卡片上，
  // 深紫箭头只有 1.3:1 基本看不见，所以夜晚换成黄箭头。
  // 显示颜色时箭头压在黄色顶面上，白天夜晚都看得清 —— 一律用同一张。
  var nc = showColors ? '' : (document.documentElement.dataset.theme === 'dark' ? '-nc-night' : '-nc');
  return 'pll/pll-' + f + nc + '-256x256.png';
};
// 切开关后把已经画出来的图换成另一套（图在 <img data-pll="编号"> 上）
function syncPllImages() {
  Array.prototype.forEach.call(document.querySelectorAll('#app img[data-pll]'), function (im) {
    im.src = IMG(im.dataset.pll);
  });
}
function setColors(on) {
  showColors = !!on;
  var box = document.getElementById('showcolors'), tg = document.getElementById('tg-colors');
  if (box) box.checked = showColors;
  if (tg) tg.classList.toggle('on', showColors);
  syncPllImages();
  try { localStorage.setItem(COLOR_KEY, showColors ? '1' : '0'); } catch (e) {}
}
function esc(s) {
  return String(s).replace(/[&<>]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
  });
}
/* 「在计算器里打开」的小图标：一台计算器（显示屏 + 四个键）。
   内联 SVG，跟着 currentColor 走，白天/夜晚都不用改。 */
var CALC_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
  '<rect x="4.4" y="2.8" width="15.2" height="18.4" rx="3.2" fill="none" ' +
  'stroke="currentColor" stroke-width="2.1"/>' +
  '<path d="M8.1 7.4h7.8" fill="none" stroke="currentColor" stroke-width="2.1" ' +
  'stroke-linecap="round"/>' +
  '<circle cx="9.4" cy="12.3" r="1.35" fill="currentColor"/>' +
  '<circle cx="14.6" cy="12.3" r="1.35" fill="currentColor"/>' +
  '<circle cx="9.4" cy="16.6" r="1.35" fill="currentColor"/>' +
  '<circle cx="14.6" cy="16.6" r="1.35" fill="currentColor"/></svg>';
function toCalc(alg, id) {
  // F2L 的 b 版是「绿色为 F 面」写的，要告诉计算器，让它按 y 公式 y' 执行。
  // 约定：hash 以 @g: 开头表示「绿面朝前」。
  var green = /b$/.test(String(id || ''));
  var frag = (green ? '@g:' : '') + encodeURIComponent(alg);
  var tip = '在计算器里打开这条公式' + (green ? '（绿色为 F 面）' : '');
  return '<a class="tocalc" href="calc.html#' + frag + '" title="' + tip +
         '" aria-label="' + tip + '">' + CALC_ICON + '</a>';
}
function row(n, alg) {
  // 一条公式里可能有换行 —— 表示同一格内的多条写法，逐行渲染
  // 用 fromCharCode(10) 取换行，避免生成器里转义被多吃一层
  var body = alg ? alg.split(String.fromCharCode(10)).map(function (line) {
      return '<code>' + esc(line) + '</code>' + toCalc(line, n);
    }).join('<br>')
    : '<span class="todo">—</span>';
  // data-zoom：这张图点一下看大图（放大镜那套在共用的 nav.js / nav.css 里）
  return '<tr>' +
         '<td class="pic"><span class="box"><img src="' + IMG(n) + '" data-zoom data-pll="' + esc(n) +
         '" alt="' + n +
         '" loading="lazy"><span class="no">' + n + '</span></span></td>' +
         '<td class="f">' + body + '</td></tr>';
}
/* 主题得在建表之前定下来 —— IMG() 要按 dataset.theme 挑无色图的昼夜版。
   不先定的话首屏会先按白天写一遍 src，再靠 syncPllImages 改回来。 */
var root = document.documentElement, savedTheme = null;
try { savedTheme = localStorage.getItem('cube-theme'); } catch (e) {}
root.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light';

var html = '';
SECTIONS.forEach(function (sec) {
  html += '<section><h2>' + esc(sec.title) +
          '<span class="cnt">' + sec.cnt + '</span></h2><table>' +
          '<colgroup><col class="pic"><col></colgroup><tbody>';
  sec.rows.forEach(function (r) { html += row(r[0], r[1]); });
  html += '</tbody></table></section>';
});
document.getElementById('app').innerHTML = html;

/* 夜晚模式 */
var themeBtn = document.getElementById('themebtn');
function applyTheme(t) {
  root.dataset.theme = t;
  syncPllImages();          // 无色版分昼夜（夜晚黄箭头），切主题要跟着换
  themeBtn.title = t === 'dark' ? '切到白天' : '切到夜晚';
  try { localStorage.setItem('cube-theme', t); } catch (e) {}
}
applyTheme(root.dataset.theme);
themeBtn.addEventListener('click', function () {
  applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
});

/* 「显示颜色」开关：勾选状态先按存档摆好，再接线 */
var colorBox = document.getElementById('showcolors'), colorTg = document.getElementById('tg-colors');
colorBox.checked = showColors;
colorTg.classList.toggle('on', showColors);
colorBox.addEventListener('change', function () { setColors(colorBox.checked); });

// 打印：旁边那个按钮直接调浏览器的打印（可以在打印对话框里选「存成 PDF」）
document.getElementById('printbtn').addEventListener('click', function () { window.print(); });

/* 点公式复制 */
var toastEl = document.getElementById('toast'), toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 1400);
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(text); }
  catch (e) { toast('复制失败，请手动选择'); }
  ta.remove();
}
document.getElementById('app').addEventListener('click', function (e) {
  // 点公式 -> 复制。图片的点击不在这里管：nav.js 统一处理「看大图」
  var el = e.target.closest ? e.target.closest('code') : null;
  if (!el) return;
  var compact = el.textContent.replace(/\s+/g, '');
  function done() { el.classList.add('copied');
    setTimeout(function () { el.classList.remove('copied'); }, 600); }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(compact).then(function () { done(); toast(compact); },
                                                function () { fallbackCopy(compact); done(); });
  } else { fallbackCopy(compact); done(); }
});
</script>
</body>
</html>
