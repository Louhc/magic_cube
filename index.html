<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六面魔方工具箱</title>
<link rel="icon" type="image/x-icon" href="cube-64x64.ico">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="nav.css">
<style>
  /* 默认浅色；点右上角切夜晚。不跟随系统。
     配色（两套主题的所有颜色变量）都在 theme.css 里，这里只管版式。 */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:relative;max-width:900px;margin:0 auto;padding:34px 20px 4px;text-align:center}
  /* 站名：上面是站标（矢量字标，「六」主色 /「面」正文色 —— 和导航条同一份图，
     由 nav.js 填进 [data-logo]），下面一行「— 魔方工具箱 —」。两行居中。
     破折号用 ::before/::after 画：写进 HTML 的话，读屏和测试都会把它当成站名的一部分。
     拉开字距会在最后一个字后面也多留一份，所以给 .sub 配一条负的 margin-right
     把那份补回来（不然整行看着往左偏）。 */
  h1{margin:0;display:flex;flex-direction:column;align-items:center;gap:22px;
     line-height:1.15;font-weight:700}
  h1 .mark{display:block;width:260px;aspect-ratio:1209/502}
  h1 .mark svg{display:block;width:100%;height:auto}
  h1 .mark .g-a{fill:var(--accent-text)}
  h1 .mark .g-b{fill:var(--text)}
  h1 .sub{display:inline-block;white-space:nowrap;font-size:19px;font-weight:600;
          letter-spacing:.34em;margin-right:-.34em;color:var(--muted)}
  h1 .sub::before,h1 .sub::after{content:'—';margin:0 .5em;font-weight:400;
                                 letter-spacing:0;color:var(--muted2, #999)}
  header p{margin:8px 0 0;color:var(--muted);font-size:13px}
  /* 只管位置 —— 开关本身的样式（尺寸/底色/滑块）在 nav.css 里，七页共用 */
  .themebtn{position:absolute;right:20px;top:34px}

  /* GitHub 纸带：经典的黑白配色 + octocat，45° 斜贴在右上角。
     位置放在导航条【下面】——不再压住导航栏。
     它会和右上角的昼夜按钮抢地方，屏幕不够宽就整条收起来（见媒体查询）。 */
  .ghribbon{position:absolute;top:var(--nav-h, 63px);right:0;width:150px;height:150px;
            overflow:hidden;pointer-events:none;z-index:30}
  .ghribbon a{position:absolute;top:36px;right:-48px;width:200px;padding:8px 0;
              display:block;transform:rotate(45deg);pointer-events:auto;
              background:#24292f;color:#fff;text-align:center;text-decoration:none;
              font-size:12px;font-weight:600;white-space:nowrap;
              box-shadow:0 1px 3px #0003;transition:background .12s, box-shadow .16s}
  /* 悬浮时抬起来一点：底色更深 + 阴影更实 */
  .ghribbon a:hover{background:#000;box-shadow:0 6px 18px #0006}
  .ghribbon svg{width:14px;height:14px;fill:currentColor;vertical-align:-2px;margin-right:6px}
  /* 夜里翻成白底黑字 —— 两边都是 GitHub 的黑白 */
  html[data-theme="dark"] .ghribbon a{background:#f0f6fc;color:#24292f}
  /* 深色底上黑色阴影根本看不见，所以夜里改用「白色光晕 + 一层暗影」来表示抬起 */
  html[data-theme="dark"] .ghribbon a:hover{background:#fff;
    box-shadow:0 6px 18px #00000080, 0 0 16px #ffffff5c}

  main{max-width:900px;margin:0 auto;padding:6px 16px 52px}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}
  /* 卡片只留标题和缩略图，不再有说明文字 */
  .card{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;
        background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:18px;min-height:140px;position:relative;
        transition:border-color .14s, transform .14s}
  .card:hover,.card:focus-within{border-color:var(--line-strong);transform:translateY(-2px)}
  /* 教程卡片整张可点：一个铺满卡片的透明链接（里面 初级 / 进阶 两个链接压在它上面） */
  .card .stretch{position:absolute;inset:0;border-radius:inherit}
  .card .thumb{flex:none;width:104px;height:104px;display:flex;align-items:center;justify-content:center}
  .card .thumb img{max-width:100%;max-height:100%;border-radius:8px}
  /* 没有说明文字了，标题放大一些，卡片才不会显得空 */
  .card h2{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em;line-height:1.2}
  .card h2 .n{color:var(--accent-text);font-weight:600;font-size:13px;margin-left:8px;
              vertical-align:2px;letter-spacing:0}
  .card p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6}
  /* 教程卡片不整张跳一个页面：标题右边给「初级 / 进阶」两个入口。
     它们要压在铺满卡片那个透明链接上面，否则点不到。 */
  .card h2 a{position:relative;z-index:1;color:var(--accent-text);font-size:13.5px;
             font-weight:600;text-decoration:none;border-bottom:1px solid transparent}
  .card h2 a:hover{border-bottom-color:var(--accent-text)}

  @media (max-width:720px){
    .cards{grid-template-columns:1fr}
    h1{gap:16px}
    h1 .mark{width:200px}
    h1 .sub{font-size:16px}
  }
  /* 纸带最左探到距视口右边 90px；右上角的昼夜按钮在窄屏会缩到 54px 处，
     两者会撞上 —— 屏宽不够（约 <980px）就干脆不显示纸带。 */
  @media (max-width:980px){ .ghribbon{display:none} }
  @media print{ .themebtn, .ghribbon{display:none} }
</style>
<script>/* 主题必须在首次绘制前定好，否则会先用浅色画一遍再翻深色（闪一下） */
try{if(localStorage.getItem('cube-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>


<script src="nav.js"></script>
<header>
  <h1>
    <span class="mark" data-logo role="img" aria-label="六面"></span>
    <span class="sub">魔方工具箱</span>
  </h1>
  <button class="themebtn" id="themebtn" type="button" title="切到夜晚"></button>
</header>

<div class="ghribbon"><a href="https://github.com/Louhc/magic_cube" target="_blank"
   rel="noopener" title="Fork me on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>Fork me on GitHub</a></div>

<main>
  <div class="cards">
    <a class="card" href="editor.html">
      <span class="thumb"><img src="preview.png" alt="配色编辑器预览"></span>
      <span>
        <h2>编辑器</h2>
      </span>
    </a>
    <a class="card" href="calc.html">
      <span class="thumb"><img src="f2l/f2l-05a-256x258.png" alt="魔方计算器"></span>
      <span>
        <h2>计算器</h2>
      </span>
    </a>
    <div class="card">
      <!-- 整张卡片可点：铺一个透明链接盖满卡片，href 由 nav.js 按「上次看的那一篇」
           填成初级或进阶（和导航条上那个「教程」入口同一条规则）。
           标题右边那两个字仍是各自的链接，盖在铺满的链接上面。 -->
      <a class="stretch" href="tutorial-basic.html" data-last="tutorial-basic.html"
         aria-label="教程"></a>
      <span class="thumb"><img src="tutorial/cross-256x258.png" alt="三阶魔方教程"></span>
      <span>
        <h2>教程 <a href="tutorial-basic.html">初级</a> · <a href="tutorial-advanced.html">进阶</a></h2>
      </span>
    </div>
    <a class="card" href="practice.html">
      <span class="thumb"><img src="pll/pll-T-256x256.png" alt="魔方练习"></span>
      <span>
        <h2>练习</h2>
      </span>
    </a>
    <a class="card" href="timer.html">
      <span class="thumb"><img src="tutorial/complete-256x258.png" alt="魔方计时器"></span>
      <span>
        <h2>计时器</h2>
      </span>
    </a>
    <!-- 三阶那三套公式（F2L / OLL / PLL）也是分页 + 一个入口 ——
         整张卡片通往「三阶公式」（跟着上次看的那一页），标题右边三个入口各跳一页 -->
    <div class="card">
      <a class="stretch" href="f2l.html" data-last="f2l.html"
         aria-label="三阶公式（F2L / OLL / PLL）"></a>
      <span class="thumb"><img src="oll/oll-01-day-256x256.png" alt="三阶公式"
        id="ollthumb"></span>
      <span>
        <h2>三阶 <a href="f2l.html">F2L</a> · <a href="oll.html">OLL</a> ·
          <a href="pll.html">PLL</a></h2>
      </span>
    </div>
    <!-- 二阶那两套公式分两页（左边那条目录互相切），导航 / 卡片合成一个入口 ——
         和「教程」那张同一个做法：整张卡片可点，标题右边两个字各是一个入口 -->
    <div class="card">
      <a class="stretch" href="oll2.html" data-last="oll2.html"
         aria-label="二阶公式（OLL / PBL）"></a>
      <span class="thumb"><img src="2x2oll/sune_day-256x256.png" alt="二阶公式"
        id="x2thumb"></span>
      <span>
        <h2>二阶 <a href="oll2.html">OLL</a> · <a href="pbl2.html">PBL</a></h2>
      </span>
    </div>
  </div>
</main>

<script>
(function () {
  'use strict';
  var root = document.documentElement, btn = document.getElementById('themebtn');
  function applyTheme(t) {
    root.dataset.theme = t;
    btn.title = t === 'dark' ? '切到白天' : '切到夜晚';
    // 首页那张 OLL 卡片也是 OLL 图，跟着主题换紫/黄顶（别的地方是 SVG/单版图）。
    // 二阶 PBL 那张是线稿图（白天深线、夜晚浅线），也得跟着换，不然夜底上看不见。
    var ot = document.getElementById('ollthumb');
    if (ot) ot.src = 'oll/oll-01-' + (t === 'dark' ? 'night' : 'day') + '-256x256.png';
    // 二阶那张也是线稿（白天深线、夜晚浅线），跟着一起换
    var o2 = document.getElementById('x2thumb');
    if (o2) o2.src = '2x2oll/sune_' + (t === 'dark' ? 'night' : 'day') + '-256x256.png';
    try { localStorage.setItem('cube-theme', t); } catch (e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem('cube-theme'); } catch (e) {}
  applyTheme(saved === 'dark' ? 'dark' : 'light');
  btn.addEventListener('click', function () {
    applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
