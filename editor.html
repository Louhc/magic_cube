<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔方配色编辑器</title>
<link rel="icon" type="image/x-icon" href="cube-64x64.ico">
<link rel="stylesheet" href="theme.css">
<style>
  /* 两套主题的所有颜色变量都在 theme.css 里，这里只管版式。 */
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);overflow:hidden;
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;height:100%}

  /* ---------- 画布 ---------- */
  .stage{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--stage);position:relative}
  /* 面板色：这条浮在舞台上，用 --chip 会和舞台同色糊掉 */
  .modebar{position:absolute;left:16px;top:14px;z-index:5;display:flex;gap:2px;
           background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
  /* 选中态的底由 .mpill 提供（和导航栏同一个做法）：一个会滑过去的小方块，
     按钮自己不再画背景，免得盖在药丸上、看着发灰 */
  .mpill{position:absolute;left:0;top:0;border-radius:6px;background:var(--accent);
         transition:transform .18s ease,width .18s ease,height .18s ease;pointer-events:none}
  /* 字色晚一步再变（延迟 = 药丸滑过来的时间）：不然新选中的那个会先压在白底上
     「闪」一下才亮 —— 导航栏当初就是这个问题。失去选中态那一边不延迟，立刻变灰。 */
  .modebar button{position:relative;z-index:1;background:none;border:none;color:var(--muted);
                  font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.09em;
                  padding:4px 13px;border-radius:6px;cursor:pointer;
                  transition:color .18s ease .18s}
  .modebar button:not(.on){transition-delay:0s}
  .modebar button:hover{color:var(--text)}
  .modebar button.on{color:var(--on-accent, #fff)}
  @media (prefers-reduced-motion: reduce){ .mpill{transition:none} }
  .stage-inner{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
               padding:18px;position:relative;overflow:hidden}
  #host{width:100%;height:100%;max-width:min(100%,88vh);max-height:100%;
        display:flex;align-items:center;justify-content:center}
  #host svg{width:100%;height:100%;display:block;overflow:visible;
            transform:scale(var(--zoom,1));transform-origin:50% 50%}
  /* 放大缩小：贴在画布右下角（舞台底部那条提示栏不属于画布，所以挂在 stage-inner 里） */
  .zoom{position:absolute;right:6px;bottom:6px;display:grid;gap:6px;z-index:4}
  .zoom button{width:40px;height:40px;padding:0;margin:0;border:0;background:none;
               box-shadow:none;border-radius:12px;cursor:pointer;
               display:grid;place-items:center;color:var(--muted);opacity:.6;
               transition:opacity .14s ease,color .14s ease,scale .12s ease}
  .zoom button svg{width:26px;height:26px;display:block;fill:none;stroke:currentColor;
                   stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .zoom button:hover:not(:disabled){opacity:1;color:var(--accent-text);scale:1.1}
  .zoom button:active:not(:disabled){scale:.94}
  .zoom button:focus-visible{opacity:1;color:var(--accent-text);
                             outline:2px solid var(--accent-text);outline-offset:-6px}
  .zoom button:disabled{opacity:.22;cursor:default}

  /* 只管位置 —— 开关本身的样式（尺寸/底色/滑块）在 nav.css 里，七页共用 */
  .themebtn{position:absolute;right:16px;top:14px;z-index:5}

  .themebtn svg{display:block}

  .hint{margin:0;padding:10px 16px;border-top:1px solid var(--line);
        color:var(--muted);font-size:12.5px;text-align:center;background:var(--hint-bg)}
  .hint kbd{background:var(--kbd-bg);border:1px solid var(--kbd-line);border-bottom-width:2px;
            border-radius:4px;padding:0 5px;font:inherit;font-size:11.5px;color:var(--kbd-fg)}

  #host .cell{cursor:pointer}
  #host .cell .sticker{transition:filter .08s ease,stroke .08s ease}
  #host .cell:hover .sticker{filter:brightness(1.18) saturate(1.1)}
  #host .cell.is-sel .sticker{stroke:var(--accent-text);stroke-width:.085}
  /* PLL 拖拽反馈 */
  #host .cell.dragging .sticker{opacity:.92}
  /* 被抓住的格子必须对指针透明：否则 elementFromPoint 只会命中它自己，
     落点永远解析成起点，怎么拖都没反应 —— 这就是之前"没有拖拽感"的一半原因 */
  #host .cell.dragging, #host .cell.dragging *{pointer-events:none}
  #host .cell.dropok .sticker{stroke:var(--accent-text);stroke-width:.09}

  /* ---------- 就地取色圈 ---------- */
  .ring{position:fixed;width:0;height:0;z-index:60;pointer-events:none}
  .ring .dot{
    position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;
    border-radius:50%;padding:0;cursor:pointer;
    display:grid;place-items:center;
    font:700 13px/1 inherit;border:2px solid #0b0e13;
    box-shadow:0 4px 14px #000a;
    opacity:0;pointer-events:none;
    transform:rotate(var(--a)) translateY(0) rotate(calc(var(--a) * -1));
    transition:transform .17s cubic-bezier(.2,.9,.3,1.25),opacity .12s ease,box-shadow .12s ease;
  }
  .ring.on .dot{
    opacity:1;pointer-events:auto;
    transform:rotate(var(--a)) translateY(calc(var(--r) * -1)) rotate(calc(var(--a) * -1));
  }
  .ring .dot:hover{box-shadow:0 0 0 3px #ffffffcc,0 4px 16px #000b}
  .ring .dot.cur{box-shadow:0 0 0 3px var(--accent-text),0 4px 14px #000a}
  .ring::after{
    content:'';position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;
    background:var(--accent);opacity:0;transition:opacity .12s ease;
  }
  .ring.on::after{opacity:1}

  /* ---------- 右侧面板 ---------- */
  .panel{width:322px;flex:none;background:var(--panel);border-left:1px solid var(--line);
         overflow-y:auto;padding:16px 16px 40px}
  .panel::-webkit-scrollbar{width:10px}
  .panel::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px;border:2px solid var(--panel)}

  .sec{margin-bottom:18px}
  /* 小标题是这一列的骨架：正文色 + 加粗 + 底下一道细线（和计算器那一列同一套） */
  .sec > h2{margin:0 0 9px;padding-bottom:6px;font-size:12px;letter-spacing:.1em;
            text-transform:uppercase;color:var(--text);font-weight:700;
            border-bottom:1px solid var(--line);
            display:flex;align-items:center;justify-content:space-between;gap:8px}
  button.mini{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;
              padding:2px 8px;font:inherit;font-size:10.5px;letter-spacing:0;text-transform:none;
              cursor:pointer;transition:.1s}
  button.mini:hover{color:var(--text);border-color:var(--line-strong);background:var(--field)}

  .row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .row label{width:52px;flex:none;color:var(--muted);font-size:12px}
  .row input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:18px}
  .row .val{width:42px;flex:none;text-align:right;font-variant-numeric:tabular-nums;
            color:#aab7c7;font-size:12px}
  .row input[type=text],.row input[type=number]{
    flex:1;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:7px;
    color:var(--text);padding:6px 9px;font:inherit;font-size:12.5px;
  }
  .row input[type=text]:focus,.row input[type=number]:focus{
    outline:none;border-color:var(--accent-text);background:var(--field-focus)}
  .row .unit{flex:none;color:var(--muted2);font-size:11.5px}

  .presets{display:flex;gap:5px;margin:0 0 11px 61px}
  .presets button{flex:1 1 0;min-width:0;background:var(--field);border:1px solid var(--line);
                  border-radius:7px;color:var(--muted);padding:5px 0;
                  font:inherit;font-size:11px;cursor:pointer;transition:.1s}
  .presets button:hover{color:var(--text);border-color:var(--line-strong)}
  .presets button.on{color:var(--chip-on-fg);border-color:var(--accent-text);background:var(--chip-on-bg)}
  .namehint{margin:-2px 0 11px 61px;color:var(--muted2);font-size:11px;line-height:1.5;word-break:break-all}
  .namehint b{color:var(--muted);font-weight:600}

  /* 分段选择（拖拽模式这种二选一） */
  .seg{display:flex;gap:3px;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:3px}
  .seg button{flex:1;background:none;border:none;color:var(--muted);font:inherit;font-size:12px;
              padding:6px 0;border-radius:6px;cursor:pointer;transition:.12s}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:var(--accent);color:var(--on-accent, #fff)}

  .schemes{display:flex;gap:7px;flex-wrap:wrap}
  /* 纯色块，不带文字（名字留在 title 里，悬停可看） */
  .schemes button{width:36px;height:36px;border-radius:9px;border:2px solid var(--line);
                  cursor:pointer;padding:0;transition:.12s}
  .schemes button:hover{border-color:var(--line-strong);transform:translateY(-1px)}
  .schemes button.on{border-color:var(--accent-text);box-shadow:0 0 0 2px var(--accent-glow)}

  /* 取色器 */
  .row input[type=color]{flex:1;min-width:0;height:32px;padding:2px;background:var(--field);
                         border:1px solid var(--line);border-radius:7px;cursor:pointer}
  .row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  .row input[type=color]::-webkit-color-swatch{border:none;border-radius:5px}

  /* 开关（显示颜色 / 跳过动画 / 明暗…）：一条轨道 + 一个滑块，和主题开关同一套语言。
     真勾选框藏起来（视觉由 .on 决定），但保留键盘可达性：Tab 能走到，:focus-within 给焦点圈。 */
  .tg{position:relative;display:inline-flex;align-items:center;padding:1px 0 1px 44px;
      cursor:pointer;color:var(--muted);font-size:12.5px;user-select:none;
      transition:color .12s ease}
  .tg input{position:absolute;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
  .tg::before{content:'';position:absolute;left:0;top:50%;width:36px;height:20px;margin-top:-10px;
              box-sizing:border-box;border-radius:10px;background:var(--line);
              border:1px solid var(--line-strong);
              transition:background .15s ease,border-color .15s ease}
  .tg::after{content:'';position:absolute;left:2px;top:50%;width:16px;height:16px;margin-top:-8px;
             border-radius:50%;background:var(--panel);box-shadow:0 1px 3px #00000033;
             transition:transform .18s cubic-bezier(.34,.86,.32,1),background .15s ease}
  .tg:hover,.tg.on{color:var(--text)}
  .tg.on::before{background:var(--accent);border-color:var(--accent)}
  .tg.on::after{transform:translateX(16px);background:var(--on-accent, #fff)}
  .tg:focus-within::before{outline:2px solid var(--accent-text);outline-offset:2px}

  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button.act{background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:8px;
             padding:9px 10px;font:inherit;font-size:12.5px;cursor:pointer;transition:background .1s}
  button.act:hover:not(:disabled){background:var(--field-hover);border-color:var(--line-strong)}
  button.act:disabled{opacity:.38;cursor:default}
  button.act.wide{width:100%;margin-top:8px}

  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
         background:var(--toast-bg);color:var(--toast-fg);border:1px solid var(--toast-line);border-radius:9px;
         padding:9px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.18s ease;
         box-shadow:0 8px 26px #0008;z-index:99}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:820px){
    .app{flex-direction:column}
    .panel{width:auto;border-left:none;border-top:1px solid var(--line);max-height:52vh}
    #host{max-width:100%;max-height:42vh}
  }
</style>
<link rel="stylesheet" href="nav.css">
<script>/* 主题必须在首次绘制前定好，否则会先画一遍再翻（闪一下）。
   本页默认配色是深色（别的页是浅色），所以「白天」也得显式写上 data-theme ——
   不能像别的页那样只在夜晚时才设，否则默认会落到深色底。 */
document.documentElement.dataset.theme = 'light';
try{if(localStorage.getItem('cube-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>

<script src="nav.js"></script>
<div class="app">
  <main class="stage" id="stage">
    <button class="themebtn" id="themebtn"></button>
    <div class="modebar" id="modebar">
      <span class="mpill" id="mpill"></span>
      <button data-mode="f2l" class="on">F2L</button>
      <button data-mode="oll">OLL</button>
      <button data-mode="pll">PLL</button>
    </div>
    <div class="stage-inner"><div id="host"></div>
      <div class="zoom">
        <button id="zin" type="button" title="放大（滚轮向上也可以）" aria-label="放大"><svg
          viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L21 21"/><path
          d="M10.5 7.6v5.8M7.6 10.5h5.8"/></svg></button>
        <button id="zout" type="button" title="缩小（滚轮向下也可以）" aria-label="缩小"><svg
          viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L21 21"/><path
          d="M7.6 10.5h5.8"/></svg></button>
        <button id="zreset" type="button" title="恢复默认大小（100%）" aria-label="恢复默认大小"><svg
          viewBox="0 0 24 24"><path d="M9.5 4.5v5h-5"/><path d="M14.5 4.5v5h5"/><path
          d="M9.5 19.5v-5h-5"/><path d="M14.5 19.5v-5h5"/></svg></button>
      </div>
    </div>
    <p class="hint" id="hint">
      点任意贴纸 → <b>就地弹出取色圈</b>，选完即走 · 右键直接清除 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销
    </p>
  </main>

  <aside class="panel">
    <section class="sec" id="sec-cam">
      <h2>相机<button class="mini" id="rst-cam">恢复默认</button></h2>
      <div class="row"><label>俯角</label><input type="range" id="elev" min="0.25" max="1.4" step="0.05"><span class="val" id="elev-v"></span></div>
      <div class="row"><label>透视</label><input type="range" id="dist" min="3.5" max="40" step="0.5"><span class="val" id="dist-v"></span></div>
    </section>

    <section class="sec" id="sec-style">
      <h2>样式<button class="mini" id="rst-style">恢复默认</button></h2>
      <div class="row"><label>边框</label><input type="range" id="gap" min="0.02" max="0.3" step="0.01"><span class="val" id="gap-v"></span></div>
      <div class="row"><label>圆角</label><input type="range" id="radius" min="0" max="0.3" step="0.01"><span class="val" id="radius-v"></span></div>
      <label class="tg" id="tg-shading"><input type="checkbox" id="shading"> 明暗</label>
    </section>

    <section class="sec" id="sec-pll">
      <h2>PLL 显示</h2>
      <div class="toggles">
        <label class="tg on" id="tg-pllcolor"><input type="checkbox" id="pllcolor" checked> 显示颜色</label>
      </div>
      <h2 style="margin-top:14px">箭头颜色</h2>
      <div class="schemes" id="arrowcolors"></div>
    </section>

    <section class="sec" id="sec-oll">
      <h2>配色</h2>
      <div class="schemes" id="schemes"></div>
      <label class="tg" id="tg-bars" style="margin-top:10px"><input type="checkbox" id="ollbars"> 显示边框划线</label>
    </section>

    <section class="sec">
      <h2>操作</h2>
      <div class="btns">
        <button class="act" id="btn-reset">恢复默认配色</button>
        <button class="act" id="btn-clear">全部清除为灰色</button>
        <button class="act" id="btn-undo">撤销</button>
        <button class="act" id="btn-redo">重做</button>
      </div>
      <button class="act wide" id="btn-params" title="只重置右栏的参数（相机/样式/配色/箭头/导出），画面内容不动">参数恢复默认</button>
    </section>

    <section class="sec">
      <h2>导出</h2>
      <div class="row">
        <label for="exname">文件名</label>
        <input type="text" id="exname" value="cube">
      </div>
      <div class="row">
        <label for="exsize">尺寸</label>
        <input type="number" id="exsize" value="512" min="16" max="8000">
        <span class="unit">px</span>
      </div>
      <div class="presets" id="expresets"></div>
      <p class="namehint" id="exhint"></p>
      <label class="tg on" id="tg-bg"><input type="checkbox" id="exbg" checked> 白色背景</label>
      <div class="btns" style="margin-top:10px">
        <button class="act" id="btn-png">PNG</button>
        <button class="act" id="btn-svg">SVG</button>
        <button class="act" id="btn-jpg">JPEG</button>
        <button class="act" id="btn-ico">ICO</button>
      </div>
    </section>
  </aside>
</div>

<div id="ring" class="ring"></div>
<div id="toast"></div>

<script src="cube.js"></script>
<script>
(function () {
  'use strict';

  var host = document.getElementById('host');
  var ringEl = document.getElementById('ring');
  var toastEl = document.getElementById('toast');

  var state = Cube.cloneState(Cube.DEFAULT_STATE);
  var cfg = Object.assign({}, Cube.DEFAULT_CFG);
  var selected = null;              // 当前高亮的格子 id
  var openId = null;                // 色圈正在服务的格子 id
  var cellIndex = {};               // id -> {face,row,col}
  var history = [], future = [];    // 撤销 / 重做

  // 模式：目前只有 F2L（三维涂色）。OLL / PLL 待实现。
  var MODES = { f2l: 'F2L', oll: 'OLL', pll: 'PLL' };
  var MODE_ZH = { f2l: 'F2L（前两层）', oll: 'OLL（顶面朝向）', pll: 'PLL（顶层排序）' };
  var mode = 'f2l';
  // 开屏的明暗由 <head> 里的预设脚本按存档定好，这里保持一致：
  // 本页默认白天（和别的页一样），存档是夜晚才用夜晚。
  var theme = 'light';                    // 'dark' | 'light'
  try { if (localStorage.getItem('cube-theme') === 'dark') theme = 'dark'; } catch (e) {}
  var oll = Cube.cloneOll(Cube.DEFAULT_OLL);
  var pll = Cube.pllDefault();               // 8 个顶层块各在哪个槽位（置换）
  var pllShowColors = true;                  // 颜色+箭头 / 仅箭头
  var pllArrowKey = Cube.PLL_DEFAULT_ARROW;  // 箭头颜色预设，默认深紫

  function pllArrowColor() { return Cube.pllArrowColorOf(pllArrowKey); }
  var scheme = Cube.OLL_DEFAULT_SCHEME;   // OLL 实心格配色方案（固定色，不随主题变）
  var showOllBars = Cube.OLL_CFG.showBars;  // 边框划线默认透明
  // 存档键：编辑器的状态是自己的；缩放另外有一个键，三页共用
  var ZOOM_KEY = 'cube-zoom-v1', MODE_KEY = 'cube-editor-v1';
  // 读取上次的编辑状态（三个模式的数据 + 选项）。放在这里：下面那些控件
  // 都是照着状态初始化的，读晚了滑块/开关就会显示默认值而状态是旧的。
  var savedEditor = loadEditor();
  restoreEditor(savedEditor);
  // forceLight：导出白底时强制用浅色底那套墨，否则浅墨画在白底上看不见
  function ollOpts(forceLight) {
    return { scheme: scheme, theme: forceLight ? 'light' : theme, showBars: showOllBars };
  }

  var RING_R = 58;
  // 从网页图标到网页展示：64(小图标) 128(图标) 256(应用图标/缩略图) 512(PWA图标/网页展示) 1024(高清)
  var SIZE_PRESETS = [64, 128, 256, 512, 1024];

  // 色圈内容 = 6 种颜色 + 清除。
  // 灰色不作为"画笔"，而是作为一个明确的动作出现在这里。
  var RING_ITEMS = Cube.PALETTE.map(function (p) {
    return { key: p.key, hex: p.hex, zh: p.zh, title: p.zh + '色' };
  }).concat([{ key: Cube.EMPTY, hex: Cube.HEX.gray, zh: '清', title: '清除为灰色', clear: true }]);

  function textOn(hex) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? 'rgba(0,0,0,.6)' : 'rgba(255,255,255,.92)';
  }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    cellIndex = {};
    if (mode === 'pll') {
      Cube.buildPll(pll, pllOpts()).cells.forEach(function (c) {
        var si = Cube.PLL_SLOTS.findIndex(function (x) { return x.row === c.row && x.col === c.col; });
        cellIndex['pll-' + c.row + '-' + c.col] = { pll: true, slot: si, row: c.row, col: c.col };
      });
      host.innerHTML = Cube.toPllSvg(pll, pllOpts());
    } else if (mode === 'oll') {
      Cube.buildOll(oll, ollOpts()).cells.forEach(function (c) {
        cellIndex[c.id] = { oll: true, row: c.row, col: c.col };
      });
      host.innerHTML = Cube.toOllSvg(oll, ollOpts());
    } else {
      Cube.buildStickers(state, cfg).cells.forEach(function (c) {
        cellIndex[c.id] = { face: c.face, row: c.row, col: c.col };
      });
      host.innerHTML = Cube.toSvg(state, cfg);
      if (selected) {
        var el = host.querySelector('[data-id="' + selected + '"]');
        if (el) el.classList.add('is-sel');
      }
    }
    syncRing();
    syncNameHint();   // 画面比例变了，导出高度也跟着变
    saveEditor();     // 改完就存（内容、选项、模式都走 render）
  }

  // 当前模式的画面尺寸（导出算高度要用）
  function currentSize() {
    if (mode === 'oll') return Cube.buildOll(oll, ollOpts()).size;
    if (mode === 'pll') return Cube.buildPll(pll, pllOpts()).size;
    return Cube.buildStickers(state, cfg).size;
  }

  // PLL 的外观选项：颜色开关 + 跟随主题的墨色
  function pllOpts(forceLight) {
    var dark = Cube.ollIsDark(forceLight ? 'light' : theme);
    return {
      showColors: pllShowColors,
      paint: dark ? { line: '#C8D0DC', head: pllArrowColor(), handle: '#5B9BFF' }
                  : { line: '#1A1A1A', head: pllArrowColor(), handle: '#2F6BD8' }
    };
  }

  /* ---------------- 取色圈 ---------------- */
  RING_ITEMS.forEach(function (item, i) {
    var a = -90 + i * (360 / RING_ITEMS.length);
    var b = document.createElement('button');
    b.className = 'dot';
    b.dataset.key = item.key;
    b.style.background = item.hex;
    b.style.color = textOn(item.hex);
    b.style.setProperty('--a', a + 'deg');
    b.style.setProperty('--r', RING_R + 'px');
    b.textContent = item.zh;
    b.title = item.title + (item.clear ? '' : '（快捷键 ' + (i + 1) + '）');
    b.addEventListener('click', function (e) { e.stopPropagation(); pick(item.key); });
    ringEl.appendChild(b);
  });

  function anchorOf(id) {
    var el = host.querySelector('[data-id="' + id + '"] .sticker');
    if (!el) return null;
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function openRing(id) {
    var p = anchorOf(id);
    if (!p) return;
    var pad = RING_R + 34;
    ringEl.style.left = Math.min(Math.max(p.x, pad), window.innerWidth - pad) + 'px';
    ringEl.style.top = Math.min(Math.max(p.y, pad), window.innerHeight - pad) + 'px';
    openId = id; selected = id;
    ringEl.classList.add('on');
    syncRing();
    render();
  }

  function closeRing() {
    ringEl.classList.remove('on');
    openId = null;
  }

  // 把该格当前的颜色在圈里标出来
  function syncRing() {
    if (!openId) return;
    var c = cellIndex[openId];
    var cur = c ? state[c.face][c.row][c.col] : null;
    Array.prototype.forEach.call(ringEl.children, function (d) {
      d.classList.toggle('cur', d.dataset.key === cur);
    });
  }

  /* ---------------- 改色 ---------------- */
  function snapshot() {
    return { f2l: Cube.cloneState(state), oll: Cube.cloneOll(oll), pll: Cube.clonePll(pll) };
  }
  function restore(snap) {
    state = Cube.cloneState(snap.f2l);
    oll = Cube.cloneOll(snap.oll);
    pll = Cube.clonePll(snap.pll || Cube.pllDefault());
  }
  function pushHistory() {
    history.push(snapshot());
    if (history.length > 200) history.shift();
    future.length = 0;
    syncHistoryButtons();
  }

  function applyTo(id, key) {
    var c = cellIndex[id];
    if (!c || state[c.face][c.row][c.col] === key) return false;
    pushHistory();
    state[c.face][c.row][c.col] = key;
    selected = id;
    render();
    return true;
  }

  function pick(key) {
    if (!openId) return;
    var id = openId;
    applyTo(id, key);
    closeRing();
    render();
  }

  /* ---------------- 画布交互 ---------------- */
  host.addEventListener('click', function (e) {
    if (mode === 'pll') return;          // PLL 用拖拽，没有点击动作
    var g = e.target.closest('.cell');
    if (!g) return;
    var id = g.dataset.id;

    if (mode === 'oll') {                 // OLL：点格子循环朝向
      var c = cellIndex[id];
      if (!c || (c.row === 1 && c.col === 1)) { toast('中心块永远朝上，不用改'); return; }
      pushHistory();
      Cube.cycleOll(oll, c.row, c.col);
      render();
      return;
    }

    if (openId === id) { closeRing(); render(); return; }   // 点同一格 = 收起
    openRing(id);
  });

  // 右键 = 直接清除，省掉开圈那一步
  host.addEventListener('contextmenu', function (e) {
    if (mode === 'pll') return;
    var g = e.target.closest('.cell');
    if (!g) return;
    var c0 = cellIndex[g.dataset.id];
    if (!c0) return;
    if (mode === 'oll') {                 // OLL：右键 = 直接设成没朝上
      e.preventDefault();
      if (Cube.ollIsCenter(c0.row, c0.col)) return;
      if (oll[c0.row][c0.col] !== 0) { pushHistory(); oll[c0.row][c0.col] = 0; render(); }
      return;
    }
    e.preventDefault();
    var c = c0;
    if (!c) return;
    if (state[c.face][c.row][c.col] !== Cube.EMPTY) applyTo(g.dataset.id, Cube.EMPTY);
    closeRing();
    render();
  });

  document.addEventListener('mousedown', function (e) {
    if (!openId) return;
    if (ringEl.contains(e.target)) return;
    if (e.target.closest('.cell')) return;
    closeRing();
    render();
  });

  window.addEventListener('resize', function () {
    if (openId) { closeRing(); render(); }
    placeMPill(syncModeButtons(), false);
  });

  /* ---------------- 放大缩小（画布右下角按钮 + 滚轮） ----------------
     缩放值写在 #host 的 --zoom 上，不写在 svg 上 —— render() 会整个换掉 svg，
     写在父元素上才不会被重画冲掉。
     svg 上的 CSS transform 会被 getBoundingClientRect 算进去，
     所以「屏幕坐标 -> SVG 坐标」那套换算（svgGeom）不用改。 */
  var zoom = 1, ZMIN = 0.5, ZMAX = 2.5;
  function applyZoom() { host.style.setProperty('--zoom', zoom); }
  function syncZoom() {
    document.getElementById('zin').disabled = zoom >= ZMAX - 0.001;
    document.getElementById('zout').disabled = zoom <= ZMIN + 0.001;
    document.getElementById('zreset').disabled = Math.abs(zoom - 1) < 0.001;
  }
  function setZoom(z) {
    var nz = Math.max(ZMIN, Math.min(ZMAX, z));
    if (Math.abs(nz - zoom) > 0.001) { zoom = nz; applyZoom(); saveZoom(); }
    syncZoom();
  }
  document.getElementById('zin').addEventListener('click', function () { setZoom(zoom * 1.25); });
  document.getElementById('zout').addEventListener('click', function () { setZoom(zoom / 1.25); });
  document.getElementById('zreset').addEventListener('click', function () { setZoom(1); });
  // 滚轮：只有指针在画布上才缩放（右栏里要正常滚动），preventDefault 掉默认滚动
  document.getElementById('stage').addEventListener('wheel', function (e) {
    e.preventDefault();
    var d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;   // Firefox 有时按「行」给
    setZoom(zoom * Math.exp(-d * 0.0016));
  }, { passive: false });
  /* 存档：模式是编辑器自己的（cube-editor-v1），缩放三页共用（cube-zoom-v1）——
     在计算器里调大的魔方，切到编辑器也是同样大小。 */
  function saveZoom() { try { localStorage.setItem(ZOOM_KEY, String(zoom)); } catch (e) {} }
  function loadZoom() {
    var v = NaN;
    try { v = parseFloat(localStorage.getItem(ZOOM_KEY)); } catch (e) {}
    return (isFinite(v) && v >= ZMIN && v <= ZMAX) ? v : 1;
  }
  /* 编辑器自己的存档（cube-editor-v1）：当前模式 + 三个模式各自的编辑状态 + 各项选项。
     数据用的是撤销那套 snapshot()/restore() —— 一份快照就是三个模式的全部内容，
     所以「切模式再切回来」「刷新再打开」都不会丢东西。
     选项 = F2L 的相机/样式 cfg、OLL 的方案与划线、PLL 的显示开关与箭头色。 */
  function saveEditor() {
    try {
      localStorage.setItem(MODE_KEY, JSON.stringify({
        mode: mode,
        snap: snapshot(),
        opts: { cfg: cfg, scheme: scheme, showOllBars: showOllBars,
                pllShowColors: pllShowColors, pllArrowKey: pllArrowKey,
                export: exportOpts() }
      }));
    } catch (e) {}
  }
  function loadEditor() {
    try {
      var d = JSON.parse(localStorage.getItem(MODE_KEY) || 'null');
      return (d && typeof d === 'object') ? d : null;
    } catch (e) { return null; }
  }
  /* 把存档灌回状态。任何一项不合法就跳过它 ——
     宁可少恢复一项，也不要一打开就崩在半路。 */
  function restoreEditor(d) {
    if (!d) return;
    try {
      if (d.snap && d.snap.f2l) restore(d.snap);
    } catch (e) {}
    var o = d.opts || {};
    if (o.cfg) cfg = Object.assign({}, Cube.DEFAULT_CFG, o.cfg);
    if (o.scheme && Cube.ollScheme(o.scheme)) scheme = o.scheme;
    if (typeof o.showOllBars === 'boolean') showOllBars = o.showOllBars;
    if (typeof o.pllShowColors === 'boolean') pllShowColors = o.pllShowColors;
    if (o.pllArrowKey && Cube.PLL_ARROW_COLORS.some(function (a) { return a.key === o.pllArrowKey; })) {
      pllArrowKey = o.pllArrowKey;
    }
  }
  function savedMode(d) { return (d && MODES[d.mode]) ? d.mode : 'f2l'; }
  zoom = loadZoom();
  applyZoom();
  syncZoom();

  /* ---------------- PLL 拖拽 ----------------
     拖方块 = 两块对调；拖箭头两端 = 拖哪端哪端跟着走。
     三种操作最后都只落到同一个置换上，所以显示不可能不一致。

     手感：按下就把方块"抓"起来 —— 提到最上层、跟着指针走；松手才落子。
     拖箭头时从"不动的那一端"拉一条虚线示意。 */
  var drag = null, dropEl = null;

  /* 屏幕坐标 -> SVG 用户坐标（preserveAspectRatio=meet，居中缩放） */
  function svgGeom() {
    var svg = host.querySelector('svg');
    if (!svg || !svg.getAttribute || !svg.getBoundingClientRect) return null;
    var vb = (svg.getAttribute('viewBox') || '').split(/\s+/).map(Number);
    var r = svg.getBoundingClientRect();
    if (!vb[2] || !vb[3] || !r.width || !r.height) return null;
    var k = Math.min(r.width / vb[2], r.height / vb[3]);
    return { svg: svg, vb: vb, k: k,
             ox: r.left + (r.width - vb[2] * k) / 2,
             oy: r.top + (r.height - vb[3] * k) / 2 };
  }
  function toUser(clientX, clientY) {
    var g = svgGeom();
    if (!g) return null;
    return [g.vb[0] + (clientX - g.ox) / g.k, g.vb[1] + (clientY - g.oy) / g.k];
  }

  function slotAtPoint(x, y) {
    if (!document.elementFromPoint) return -1;
    var el = document.elementFromPoint(x, y);
    while (el && !(el.dataset && el.dataset.slot)) el = el.parentNode;
    if (!el || el.dataset.slot === 'center') return -1;
    var i = Cube.PLL_SLOT_BY_ID[el.dataset.slot];
    return (i === undefined) ? -1 : i;
  }
  function markDrop(to) {
    if (dropEl && dropEl.classList) dropEl.classList.remove('dropok');
    dropEl = null;
    if (!drag || to < 0 || !Cube.pllSameKind(drag.from, to)) return;
    var el = host.querySelector('[data-slot="' + Cube.PLL_SLOTS[to].id + '"]');
    if (el && el.classList) { el.classList.add('dropok'); dropEl = el; }
  }
  function endDragVisual() {
    if (!drag) return;
    if (drag.el) {
      if (drag.el.removeAttribute) drag.el.removeAttribute('transform');
      if (drag.el.classList) drag.el.classList.remove('dragging');
    }
    if (dropEl && dropEl.classList) dropEl.classList.remove('dropok');
    dropEl = null;
  }

  host.addEventListener('pointerdown', function (e) {
    if (mode !== 'pll' || !e.target.closest) return;
    // 只拖方块。交换可以生成任意置换，所以拖箭头没有额外能力，
    // 还多一层"我到底抓到的是哪个"的困惑 —— 去掉了。
    var cellEl = e.target.closest('.cell');
    if (!cellEl || !cellEl.dataset.slot || cellEl.dataset.slot === 'center') return;
    var from = Cube.PLL_SLOT_BY_ID[cellEl.dataset.slot];
    if (from === undefined) return;
    var kind = 'piece';
    if (e.preventDefault) e.preventDefault();
    if (host.setPointerCapture && e.pointerId !== undefined) {
      try { host.setPointerCapture(e.pointerId); } catch (err) {}
    }
    drag = { kind: kind, from: from, el: cellEl,
             start: toUser(e.clientX, e.clientY) };

    // 提到最上层，拖的时候才不会被别的格子压住
    if (cellEl.parentNode && cellEl.parentNode.appendChild) cellEl.parentNode.appendChild(cellEl);
    if (cellEl.classList) cellEl.classList.add('dragging');
  });

  host.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = toUser(e.clientX, e.clientY);
    if (p) {
      if (drag.el && drag.el.setAttribute && drag.start) {
        drag.el.setAttribute('transform', 'translate(' +
          (p[0] - drag.start[0]).toFixed(3) + ',' + (p[1] - drag.start[1]).toFixed(3) + ')');
      }
    }
    markDrop(slotAtPoint(e.clientX, e.clientY));
  });

  host.addEventListener('pointerup', function (e) {
    if (mode !== 'pll' || !drag) return;
    var d = drag, to = slotAtPoint(e.clientX, e.clientY);
    endDragVisual();
    drag = null;
    if (to < 0 || !Cube.pllSameKind(d.from, to)) { render(); return; }
    pushHistory();
    var ok = Cube.pllSwap(pll, d.from, to);
    if (ok) render();
    else { history.pop(); syncHistoryButtons(); render(); }
  });

  host.addEventListener('pointercancel', function () {
    if (!drag) return;
    endDragVisual();
    drag = null;
    render();
  });

  /* 箭头颜色：和 OLL 配色同一套色卡样式 */
  var arrowEl = document.getElementById('arrowcolors');
  function syncArrowColors() {
    Array.prototype.forEach.call(arrowEl.children, function (b) {
      b.classList.toggle('on', b.dataset.key === pllArrowKey);
    });
  }
  Cube.PLL_ARROW_COLORS.forEach(function (ac) {
    var b = document.createElement('button');
    b.dataset.key = ac.key;
    b.title = ac.zh;
    b.style.background = ac.on;
    b.addEventListener('click', function () { pllArrowKey = ac.key; syncArrowColors(); render(); });
    arrowEl.appendChild(b);
  });
  syncArrowColors();

  /* PLL 显示开关：颜色+箭头 / 仅箭头 */
  var pllColorEl = document.getElementById('pllcolor'), tgPllColor = document.getElementById('tg-pllcolor');
  pllColorEl.checked = pllShowColors;
  tgPllColor.classList.toggle('on', pllShowColors);
  pllColorEl.addEventListener('change', function () {
    pllShowColors = pllColorEl.checked;
    tgPllColor.classList.toggle('on', pllShowColors);
    render();
  });

  /* ---------------- 撤销 / 重做 ---------------- */
  var btnUndo = document.getElementById('btn-undo'), btnRedo = document.getElementById('btn-redo');
  function syncHistoryButtons() {
    btnUndo.disabled = history.length === 0;
    btnRedo.disabled = future.length === 0;
  }
  function undo() {
    if (!history.length) return;
    future.push(snapshot());
    restore(history.pop());
    selected = null; closeRing(); render(); syncHistoryButtons();
  }
  function redo() {
    if (!future.length) return;
    history.push(snapshot());
    restore(future.pop());
    selected = null; closeRing(); render(); syncHistoryButtons();
  }
  btnUndo.addEventListener('click', undo);
  btnRedo.addEventListener('click', redo);

  /* ---------------- 滑块 ---------------- */
  var ranges = [];
  function bindRange(id, key, fmt) {
    var el = document.getElementById(id), out = document.getElementById(id + '-v');
    ranges.push({ el: el, out: out, key: key, fmt: fmt });
    el.addEventListener('input', function () {
      cfg[key] = parseFloat(el.value);
      out.textContent = fmt(cfg[key]);
      closeRing(); render();
    });
  }
  bindRange('elev', 'elev', function (v) { return v.toFixed(2); });
  bindRange('dist', 'dist', function (v) { return v.toFixed(1); });
  bindRange('gap', 'gap', function (v) { return (v * 100).toFixed(0) + '%'; });
  bindRange('radius', 'radius', function (v) { return (v * 100).toFixed(0) + '%'; });

  var shEl = document.getElementById('shading'), tgSh = document.getElementById('tg-shading');
  shEl.addEventListener('change', function () {
    cfg.shading = shEl.checked;
    tgSh.classList.toggle('on', cfg.shading);
    closeRing(); render();
  });

  // 把 cfg 的当前值回写到所有控件（复位按钮需要）
  function syncControls() {
    ranges.forEach(function (r) {
      r.el.value = cfg[r.key];
      r.out.textContent = r.fmt(cfg[r.key]);
    });
    shEl.checked = cfg.shading;
    tgSh.classList.toggle('on', cfg.shading);
  }

  function resetCfg(keys, label) {
    keys.forEach(function (k) { cfg[k] = Cube.DEFAULT_CFG[k]; });
    syncControls();
    closeRing(); render();
    toast(label + '已恢复默认');
  }
  document.getElementById('rst-cam').addEventListener('click', function () {
    resetCfg(['elev', 'dist'], '相机');
  });
  document.getElementById('rst-style').addEventListener('click', function () {
    resetCfg(['gap', 'radius', 'shading'], '样式');
  });

  /* ---------------- 白天 / 夜晚 ---------------- */
  var themeBtn = document.getElementById('themebtn');
  function applyTheme(t, silent) {
    theme = (t === 'light') ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    // 和别的页共用同一个键 —— 以前编辑器只在开屏读了一下、从不写，
    // 所以在编辑器里切了主题，切到别的页又变回去
    try { localStorage.setItem('cube-theme', theme); } catch (e) {}
    themeBtn.title = theme === 'light' ? '切换到夜晚模式' : '切换到白天模式';
    syncSchemes();          // 色卡颜色随主题变
    closeRing();
    render();
    if (!silent) toast(theme === 'light' ? '已切换到白天模式' : '已切换到夜晚模式');
  }
  themeBtn.addEventListener('click', function () {
    applyTheme(theme === 'light' ? 'dark' : 'light');
  });

  /* 边框划线开关（默认关：只留格子本身） */
  var olBarsEl = document.getElementById('ollbars'), tgBars = document.getElementById('tg-bars');
  olBarsEl.checked = showOllBars;
  tgBars.classList.toggle('on', showOllBars);
  olBarsEl.addEventListener('change', function () {
    showOllBars = olBarsEl.checked;
    tgBars.classList.toggle('on', showOllBars);
    render();
  });

  /* ---------------- 配色方案 ---------------- */
  var schemesEl = document.getElementById('schemes');
  Cube.OLL_SCHEMES.forEach(function (sc) {
    var b = document.createElement('button');
    b.dataset.key = sc.key;
    b.title = sc.zh;
    b.style.background = sc.on;                  // 纯色块，不放文字
    b.title = sc.zh;                             // 名字放 title，悬停可见
    b.addEventListener('click', function () { scheme = sc.key; syncSchemes(); render(); });
    schemesEl.appendChild(b);
  });
  /* 色卡显示的就是实际用的颜色（固定色，两种主题下都一样）。
     注意别读方案上不存在的字段 —— 之前字段改名时这里没跟着改，
     取到 undefined 导致色卡全成了空白框。 */
  function syncSchemes() {
    Array.prototype.forEach.call(schemesEl.children, function (b) {
      b.style.background = Cube.ollScheme(b.dataset.key).on;
      b.classList.toggle('on', b.dataset.key === scheme);
    });
  }

  /* ---------------- 导出 ---------------- */
  var exName = document.getElementById('exname');
  var exSize = document.getElementById('exsize');
  var exBg = document.getElementById('exbg');
  var tgBg = document.getElementById('tg-bg');
  var presetsEl = document.getElementById('expresets');
  var exHint = document.getElementById('exhint');

  // 导出这三项也算「参数」，一样存档、一样能被「参数恢复默认」复位。
  // 默认值写在这里（和标记里 value="cube" / value="512" / checked 对应，测试盯着它们别走偏）
  var EX_DEFAULT = { name: 'cube', size: 512, bg: true };
  function exportOpts() {
    return { name: exName.value, size: exportSize(), bg: !!exBg.checked };
  }
  function resetExportOpts() {
    exName.value = EX_DEFAULT.name;
    exSize.value = EX_DEFAULT.size;
    exBg.checked = EX_DEFAULT.bg;
  }
  // 读回上次的导出参数
  var savedEx = (savedEditor && savedEditor.opts && savedEditor.opts.export) || {};
  if (typeof savedEx.name === 'string') exName.value = savedEx.name;
  if (isFinite(savedEx.size)) exSize.value = savedEx.size;
  if (typeof savedEx.bg === 'boolean') exBg.checked = savedEx.bg;

  exBg.addEventListener('change', function () {
    tgBg.classList.toggle('on', exBg.checked);
    saveEditor();
  });
  tgBg.classList.toggle('on', exBg.checked);

  function safeName() {
    var n = (exName.value || '').trim().replace(/[\\/:*?"<>|]+/g, '-').replace(/\.+$/, '');
    return n || 'cube';
  }
  function exportSize() {
    var v = parseInt(exSize.value, 10);
    if (!isFinite(v)) v = 512;
    return Math.max(16, Math.min(8000, v));
  }
  // 按当前尺寸算出的实际输出宽高（高度随画面比例变化）
  function exportDims() {
    var size = currentSize();
    var w = exportSize();
    return { w: w, h: Math.round(w * size.h / size.w) };
  }
  // 实际文件名 = 文件名 + 宽x高，例如 cube-1080x1087.png
  function exportName(w, h, ext) {
    return safeName() + '-' + w + 'x' + h + '.' + ext;
  }
  function syncNameHint() {
    var d = exportDims();
    exHint.innerHTML = '将导出 <b>' + exportName(d.w, d.h, 'png') + '</b> / <b>' +
      exportName(d.w, d.h, 'svg') + '</b> / <b>' + exportName(d.w, d.h, 'jpg') + '</b>';
  }
  function syncPresets() {
    var cur = exportSize();
    Array.prototype.forEach.call(presetsEl.children, function (b, i) {
      b.classList.toggle('on', SIZE_PRESETS[i] === cur);
    });
  }
  SIZE_PRESETS.forEach(function (v) {
    var b = document.createElement('button');
    b.textContent = String(v);
    b.addEventListener('click', function () {
      exSize.value = v; syncPresets(); syncNameHint(); saveEditor();
    });
    presetsEl.appendChild(b);
  });
  exSize.addEventListener('input', function () { syncPresets(); syncNameHint(); saveEditor(); });
  // 文件名里不允许的字符就地替换掉，省得导出时才发现
  exName.addEventListener('input', function () {
    var clean = exName.value.replace(/[\\/:*?"<>|]+/g, '-');
    if (clean !== exName.value) exName.value = clean;
    syncNameHint();
    saveEditor();
  });

  // 按指定像素宽生成 SVG（等比算高度），宽高写进 <svg> 标签
  function buildSvg(px, withBg) {
    var size = currentSize();
    var w = px, h = Math.round(px * size.h / size.w);
    var bg = withBg ? { background: '#ffffff' } : null;
    var svg = mode === 'oll' ? Cube.toOllSvg(oll, ollOpts(!!withBg), bg)
            : mode === 'pll' ? Cube.toPllSvg(pll, pllOpts(!!withBg), bg)
            : Cube.toSvg(state, cfg, bg);
    svg = svg.replace(/<svg[^>]*>/, function (tag) {
      return tag.replace(/width="[^"]*"/, 'width="' + w + '"')
                .replace(/height="[^"]*"/, 'height="' + h + '"');
    });
    return { svg: svg, w: w, h: h };
  }

  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  /* 把 SVG 光栅化成位图。PNG / JPEG / ICO 都走这里。
     jpeg 不支持透明，所以无论勾没勾白底都强制铺白 —— 否则透明处会变黑。 */
  function rasterize(e, mime, quality, cb) {
    var url = URL.createObjectURL(new Blob([e.svg], { type: 'image/svg+xml;charset=utf-8' }));
    var img = new Image();
    img.onload = function () {
      var cv = document.createElement('canvas');
      cv.width = e.w; cv.height = e.h;
      var ctx = cv.getContext('2d');
      if (mime === 'image/jpeg') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, e.w, e.h); }
      ctx.drawImage(img, 0, 0, e.w, e.h);
      URL.revokeObjectURL(url);
      cv.toBlob(function (b) { cb(b); }, mime, quality);
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
    img.src = url;
  }

  document.getElementById('btn-png').addEventListener('click', function () {
    var e = buildSvg(exportSize(), exBg.checked);
    var name = exportName(e.w, e.h, 'png');
    rasterize(e, 'image/png', undefined, function (b) {
      if (!b) return toast('PNG 导出失败，请改用 SVG');
      download(b, name);
      toast('已导出 ' + name + '（' + e.w + '×' + e.h + '）');
    });
  });

  document.getElementById('btn-jpg').addEventListener('click', function () {
    var e = buildSvg(exportSize(), true);      // 强制白底
    var name = exportName(e.w, e.h, 'jpg');
    rasterize(e, 'image/jpeg', 0.92, function (b) {
      if (!b) return toast('JPEG 导出失败，请改用 PNG');
      download(b, name);
      toast('已导出 ' + name + '（' + e.w + '×' + e.h + '）');
    });
  });

  /* ICO = 6 字节目录 + 16 字节条目 + 一张 PNG（Vista 起支持 PNG 承载）。
     浏览器没有 ICO 编码器，所以自己拼这个头。 */
  function icoHeader(w, h, pngLen) {
    var head = new Uint8Array(22), dv = new DataView(head.buffer);
    dv.setUint16(0, 0, true);          // reserved
    dv.setUint16(2, 1, true);          // type: 1 = icon
    dv.setUint16(4, 1, true);          // 只有一张图
    head[6] = w >= 256 ? 0 : w;        // 宽（0 代表 256）
    head[7] = h >= 256 ? 0 : h;        // 高
    head[8] = 0; head[9] = 0;          // 调色板数 / 保留
    dv.setUint16(10, 1, true);         // 色彩平面
    dv.setUint16(12, 32, true);        // 每像素位数
    dv.setUint32(14, pngLen, true);    // PNG 字节数
    dv.setUint32(18, 22, true);        // PNG 起始偏移
    return head;
  }

  document.getElementById('btn-ico').addEventListener('click', function () {
    // 图标尺寸惯例不超过 256，再大也没意义
    var px = Math.min(256, exportSize());
    // ICO 是 32 位带 alpha 的，支持透明 —— 这里要**尊重**「白色背景」开关。
    // （只有 JPEG 需要强制白底，因为它没有 alpha 通道。）
    var e = buildSvg(px, exBg.checked);
    var name = exportName(e.w, e.h, 'ico');
    rasterize(e, 'image/png', undefined, function (b) {
      if (!b) return toast('ICO 导出失败，请改用 PNG');
      var fr = new FileReader();
      fr.onload = function () {
        var png = new Uint8Array(fr.result);
        download(new Blob([icoHeader(e.w, e.h, png.length), png], { type: 'image/x-icon' }), name);
        toast('已导出 ' + name + '（' + e.w + '×' + e.h + '）');
      };
      fr.onerror = function () { toast('ICO 导出失败，请改用 PNG'); };
      fr.readAsArrayBuffer(b);
    });
  });

  document.getElementById('btn-svg').addEventListener('click', function () {
    var e = buildSvg(exportSize(), exBg.checked);
    var name = exportName(e.w, e.h, 'svg');
    download(new Blob([e.svg], { type: 'image/svg+xml;charset=utf-8' }), name);
    toast('已导出 ' + name + '（' + e.w + '×' + e.h + '）');
  });

  /* ---------------- 配色操作 ---------------- */
  document.getElementById('btn-reset').addEventListener('click', function () {
    pushHistory();
    if (mode === 'pll') {
      pll = Cube.pllDefault();
      render(); toast('已还原为已复原状态');
      return;
    }
    if (mode === 'oll') {
      oll = Cube.cloneOll(Cube.DEFAULT_OLL);
      render(); toast('已恢复默认朝向');
    } else {
      state = Cube.cloneState(Cube.DEFAULT_STATE);
      selected = null; closeRing(); render(); toast('已恢复默认配色');
    }
  });
  document.getElementById('btn-clear').addEventListener('click', function () {
    pushHistory();
    if (mode === 'oll') {
      oll = Cube.ollAll(false);            // 中心块仍是朝上
      render(); toast('已全部设为未朝向');
    } else {
      Object.keys(state).forEach(function (f) {
        for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) state[f][r][c] = Cube.EMPTY;
      });
      selected = null; closeRing(); render(); toast('已全部清除为灰色');
    }
  });

  /* ---------------- 键盘 ---------------- */
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
      return;
    }
    if (e.key === 'Escape' && openId) { closeRing(); render(); return; }
    if (mode !== 'f2l') return;          // 颜色快捷键只在 F2L 下有意义
    if (!selected) return;
    var i = '123456'.indexOf(e.key);
    if (i >= 0) { applyTo(selected, Cube.PALETTE[i].key); closeRing(); render(); return; }
    if (e.key === '0' || e.key === 'Backspace' || e.key === 'Delete') {
      e.preventDefault(); applyTo(selected, Cube.EMPTY); closeRing(); render();
    }
  });

  /* 选中态的小方块：和导航栏一样，切模式时滑过去，而不是"跳"过去。
     位置用按钮的 offsetLeft/offsetTop —— 绝对定位的子元素正好也是相对
     padding 边算的，所以药丸和按钮对得上（modebar 自己有 3px 内边距）。 */
  var mpill = document.getElementById('mpill');
  function placeMPill(el, animate) {
    if (!mpill || !el) return;
    if (!animate) mpill.style.transition = 'none';
    mpill.style.width = el.offsetWidth + 'px';
    mpill.style.height = el.offsetHeight + 'px';
    mpill.style.transform = 'translate(' + el.offsetLeft + 'px,' + el.offsetTop + 'px)';
    if (!animate) {
      void mpill.offsetWidth;          // 逼一次重排，免得初始定位也被当成动画
      mpill.style.transition = '';
    }
  }
  function syncModeButtons() {
    var active = null;
    Array.prototype.forEach.call(document.getElementById('modebar').children, function (b) {
      if (!b.dataset || !b.dataset.mode) return;      // 跳过药丸本身
      b.classList.toggle('on', b.dataset.mode === mode);
      if (b.dataset.mode === mode) active = b;
    });
    return active;
  }

  function setMode(m, animate) {
    if (!MODES[m]) return;
    mode = m;
    saveEditor();
    placeMPill(syncModeButtons(), animate !== false);
    document.title = '魔方配色编辑器 · ' + MODES[m];
    syncModeUI();
    closeRing();
    render();
  }

  // 两种模式能做的事不一样，按钮文案和可见性跟着切
  function syncModeUI() {
    var isF2l = mode === 'f2l', isOll = mode === 'oll', isPll = mode === 'pll';
    document.getElementById('btn-reset').textContent =
      isOll ? '恢复默认朝向' : (isPll ? '还原为已复原' : '恢复默认配色');
    document.getElementById('btn-clear').textContent =
      isOll ? '全部设为未朝向' : '全部清除为灰色';
    document.getElementById('btn-clear').style.display = isPll ? 'none' : '';
    document.getElementById('sec-pll').style.display = isPll ? '' : 'none';
    document.getElementById('sec-oll').style.display = isOll ? '' : 'none';
    // 相机 / 样式 只作用于 F2L 的三维渲染，二维那两个图用的是各自那套参数
    document.getElementById('sec-cam').style.display = isF2l ? '' : 'none';
    document.getElementById('sec-style').style.display = isF2l ? '' : 'none';

    document.getElementById('hint').innerHTML =
      isOll ? '点格子循环<b>黄色朝向</b>（实心 = 朝上）· 边框线只是显示：深色 = 黄色正从那一面露出，浅灰 = 该块其他可选的面 · 右键设回朝上'
      : isPll ? '<b>拖动方块</b>可把两块对调（交换能拼出任意排列）· 箭头会自动更新，表示「这块该去哪」· <kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销'
      : '点任意贴纸 → <b>就地弹出取色圈</b>，选完即走 · 右键直接清除 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销';
  }

  Array.prototype.forEach.call(document.getElementById('modebar').children, function (b) {
    b.addEventListener('click', function () { setMode(b.dataset.mode); });
  });

  /* 一键把右栏参数恢复默认：相机 / 样式 / 配色方案 / 边框划线 / 箭头色 / 导出设置。
     画面内容（画上去的贴纸、朝向、置换）不归它管 —— 那是各模式里
     「恢复默认配色 / 恢复默认朝向 / 还原为已复原」那三个按钮的事。 */
  document.getElementById('btn-params').addEventListener('click', function () {
    cfg = Object.assign({}, Cube.DEFAULT_CFG);
    scheme = Cube.OLL_DEFAULT_SCHEME;
    showOllBars = Cube.OLL_CFG.showBars;
    pllShowColors = true;
    pllArrowKey = Cube.PLL_DEFAULT_ARROW;
    resetExportOpts();
    // 控件跟着回写（不然状态是默认的、面板还显示旧值）
    syncControls();
    syncPresets();
    syncSchemes();
    syncArrowColors();
    pllColorEl.checked = pllShowColors;
    tgPllColor.classList.toggle('on', pllShowColors);
    olBarsEl.checked = showOllBars;
    tgBars.classList.toggle('on', showOllBars);
    tgBg.classList.toggle('on', exBg.checked);
    syncNameHint();
    closeRing();
    render();              // 里面的 saveEditor() 顺手把这份默认值写进存档
    toast('参数已恢复默认');
  });

  syncControls();
  syncPresets();
  syncSchemes();
  applyTheme(theme, true);
  syncHistoryButtons();
  setMode(savedMode(savedEditor), false);   // 首次定位不要动画
})();
</script>
</body>
</html>
