<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔方计算器</title>
<link rel="icon" type="image/x-icon" href="cube-64x64.ico">
<link rel="stylesheet" href="nav.css">
<style>
  :root{
    color-scheme: light;
    --bg:#eef1f6; --card:#ffffff; --line:#d8dee7; --line-strong:#b9c3d0;
    --text:#1e2530; --muted:#6a7686; --accent:#2f6bd8; --field:#f4f6f9;
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --bg:#151a22; --card:#1b222c; --line:#2a3340; --line-strong:#3a4553;
    --text:#e7edf5; --muted:#8a98aa; --accent:#5b9bff; --field:#222a35;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:relative;padding:22px 20px 8px;text-align:center}
  h1{margin:0;font-size:20px;letter-spacing:.02em}
  .themebtn{position:absolute;right:16px;top:16px;width:34px;height:34px;padding:0;
            border-radius:9px;background:var(--field);border:1px solid var(--line);
            color:var(--text);font-size:15px;line-height:1;cursor:pointer;transition:.12s}
  .themebtn:hover{border-color:var(--line-strong)}
  main{max-width:620px;margin:0 auto;padding:10px 16px 60px}

  .bar{display:flex;gap:8px}
  #alg{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);
       border-radius:9px;padding:10px 12px;color:var(--text);
       font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #alg:focus{outline:none;border-color:var(--accent)}
  #alg.bad{border-color:#c0392b}

  .ctrl{display:flex;align-items:center;gap:6px;margin-top:10px}
  .ctrl button{width:38px;height:34px;padding:0;border-radius:8px;cursor:pointer;
               background:var(--card);border:1px solid var(--line);color:var(--text);
               font-size:13px;line-height:1;transition:.12s}
  .ctrl button:hover:not(:disabled){border-color:var(--line-strong);background:var(--field)}
  .ctrl button:disabled{opacity:.35;cursor:default}
  .ctrl .pos{margin-left:auto;color:var(--muted);font:12.5px ui-monospace,Menlo,monospace}

  /* 当前这一步高亮 */
  .moves{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;min-height:24px}
  .moves span{font:12.5px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);
              background:var(--card);border:1px solid var(--line);border-radius:5px;
              padding:5px 7px;cursor:pointer;transition:.1s}
  .moves span:hover{border-color:var(--line-strong);color:var(--text)}
  .moves span.done{color:var(--text);border-color:var(--line-strong)}
  .moves span.cur{background:var(--accent);border-color:var(--accent);color:#fff}

  /* 展开图 */
  .netwrap{margin-top:16px;background:var(--card);border:1px solid var(--line);
           border-radius:12px;padding:16px}
  .net{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;
       width:100%;max-width:420px;margin:0 auto}
  .net i{border-radius:3px;aspect-ratio:1/1;box-shadow:inset 0 0 0 1px #00000030}

  .err{margin-top:10px;color:#c0392b;font-size:12.5px;min-height:18px}
  @media print{ .themebtn,.ctrl,#alg{display:none} }
</style>
</head>
<body>

<header>
  <h1>魔方计算器</h1>
  <button class="themebtn" id="themebtn" type="button" title="切到夜晚">☾</button>
</header>

<main>
  <div class="bar">
    <input id="alg" type="text" spellcheck="false" autocomplete="off" value="R U R' U'">
  </div>

  <div class="ctrl">
    <button id="first" type="button" title="回到开头">⏮</button>
    <button id="prev"  type="button" title="上一步">◀</button>
    <button id="next"  type="button" title="下一步">▶</button>
    <button id="last"  type="button" title="到最后">⏭</button>
    <span class="pos" id="pos">0 / 0</span>
  </div>

  <div class="moves" id="moves"></div>
  <div class="err" id="err"></div>

  <div class="netwrap"><div class="net" id="net"></div></div>
</main>

<script src="cubesim.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  'use strict';

  // 六色（和项目其它页面一致）
  var COLOR = { U: '#FFE600', D: '#C0C0C0', F: '#00B050',
                B: '#0070C0', R: '#C00000', L: '#FF8C00' };
  // 展开图：十字形（U 在上，L F R B 一排，D 在下）
  var NET = [['U', 1, 4], ['L', 4, 1], ['F', 4, 4], ['R', 4, 7], ['B', 4, 10], ['D', 7, 4]];

  var algEl = document.getElementById('alg');
  var movesEl = document.getElementById('moves');
  var netEl = document.getElementById('net');
  var posEl = document.getElementById('pos');
  var errEl = document.getElementById('err');

  var steps = [];      // [{mv, times}]
  var frames = [];     // 每个阶段一个局面，frames[k] = 做完前 k 步之后
  var at = 0;

  netEl.innerHTML = (function () {
    var h = '';
    NET.forEach(function (spec) {
      for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) {
        h += '<i data-f="' + spec[0] + '" data-i="' + (r * 3 + c) + '"' +
             ' style="grid-row:' + (spec[1] + r + 1) + ';grid-column:' + (spec[2] + c + 1) + '"></i>';
      }
    });
    return h;
  })();

  function label(s) {
    return s.mv + (s.times === 2 ? '2' : s.times === -1 ? "'" : s.times === -2 ? "2'" : '');
  }

  function rebuild() {
    errEl.textContent = '';
    algEl.classList.remove('bad');
    try {
      steps = CubeSim.steps(algEl.value);
    } catch (e) {
      steps = [];
      algEl.classList.add('bad');
      errEl.textContent = e.message;
    }
    // 每个阶段都算出来，拖动进度就不用重算
    frames = [CubeSim.solved()];
    var st = frames[0];
    steps.forEach(function (s) {
      st = CubeSim.turn(CubeSim.clone(st), s.mv, s.times);
      frames.push(st);
    });
    at = frames.length - 1;
    movesEl.innerHTML = steps.map(function (s, i) {
      return '<span data-k="' + (i + 1) + '">' + label(s) + '</span>';
    }).join('');
    draw();
  }

  function draw() {
    var st = frames[at] || frames[0];
    var f = CubeSim.facelets(st);
    Array.prototype.forEach.call(netEl.children, function (el) {
      el.style.background = COLOR[f[el.dataset.f][+el.dataset.i]];
    });
    Array.prototype.forEach.call(movesEl.children, function (el) {
      var k = +el.dataset.k;
      el.classList.toggle('cur', k === at);
      el.classList.toggle('done', k < at);
    });
    posEl.textContent = at + ' / ' + steps.length;
    document.getElementById('first').disabled = at === 0;
    document.getElementById('prev').disabled = at === 0;
    document.getElementById('next').disabled = at >= steps.length;
    document.getElementById('last').disabled = at >= steps.length;
  }

  function go(d) { at = Math.max(0, Math.min(steps.length, at + d)); draw(); }

  algEl.addEventListener('input', rebuild);
  document.getElementById('first').addEventListener('click', function () { at = 0; draw(); });
  document.getElementById('prev').addEventListener('click', function () { go(-1); });
  document.getElementById('next').addEventListener('click', function () { go(1); });
  document.getElementById('last').addEventListener('click', function () { at = steps.length; draw(); });
  movesEl.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('span[data-k]') : null;
    if (el) { at = +el.dataset.k; draw(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.target === algEl) return;
    if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'ArrowRight') go(1);
  });

  /* 夜晚模式 */
  var root = document.documentElement, btn = document.getElementById('themebtn');
  function applyTheme(t) {
    root.dataset.theme = t;
    btn.textContent = t === 'dark' ? '\u2600' : '\u263e';
    btn.title = t === 'dark' ? '切到白天' : '切到夜晚';
    try { localStorage.setItem('cube-theme', t); } catch (e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem('cube-theme'); } catch (e) {}
  applyTheme(saved === 'dark' ? 'dark' : 'light');
  btn.addEventListener('click', function () {
    applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  rebuild();
})();
</script>
</body>
</html>
