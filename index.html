<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔方工具箱</title>
<link rel="icon" type="image/x-icon" href="cube-64x64.ico">
<link rel="stylesheet" href="nav.css">
<style>
  /* 默认浅色；点右上角切夜晚。不跟随系统。 */
  :root{
    color-scheme: light;
    --bg:#eef1f6; --card:#ffffff;   /* 页面底压暗一档，卡片保持白 -> 靠层次降低刺眼感 */ --line:#d8dee7; --line-strong:#b9c3d0;
    --text:#1e2530; --muted:#6a7686; --accent:#2f6bd8; --field:#f4f6f9;
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --bg:#151a22; --card:#1b222c; --line:#2a3340; --line-strong:#3a4553;
    --text:#e7edf5; --muted:#8a98aa; --accent:#5b9bff; --field:#222a35;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:relative;max-width:900px;margin:0 auto;padding:34px 20px 4px;text-align:center}
  h1{margin:0;font-size:24px;letter-spacing:.03em}
  header p{margin:8px 0 0;color:var(--muted);font-size:13px}
  .themebtn{position:absolute;right:20px;top:34px;width:34px;height:34px;padding:0;
            border-radius:9px;background:var(--field);border:1px solid var(--line);
            color:var(--text);font-size:15px;line-height:1;cursor:pointer;transition:.12s}
  .themebtn:hover{border-color:var(--line-strong)}

  main{max-width:900px;margin:0 auto;padding:6px 16px 52px}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}
  .card{display:flex;align-items:center;gap:15px;text-decoration:none;color:inherit;
        background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:15px;transition:border-color .14s, transform .14s}
  .card:hover{border-color:var(--line-strong);transform:translateY(-2px)}
  .card .thumb{flex:none;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
  .card .thumb img{max-width:100%;max-height:100%;border-radius:8px}
  .card h2{margin:0 0 5px;font-size:15px}
  .card h2 .n{color:var(--accent);font-weight:600;font-size:12.5px;margin-left:6px}
  .card p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6}

  @media (max-width:720px){
    .cards{grid-template-columns:1fr}
    h1{font-size:20px}
  }
  @media print{ .themebtn{display:none} }
</style>
</head>
<body>

<header>
  <h1>魔方工具箱</h1>
  <button class="themebtn" id="themebtn" type="button" title="切到夜晚">☾</button>
</header>

<main>
  <div class="cards">
    <a class="card" href="editor.html">
      <span class="thumb"><img src="preview.png" alt="配色编辑器预览"></span>
      <span>
        <h2>编辑器</h2>
        <p>透视三维 + OLL / PLL 二维 · 导出 PNG / SVG / JPEG / ICO</p>
      </span>
    </a>
    <a class="card" href="f2l.html">
      <span class="thumb"><img src="f2l/f2l-01a-512x515.png" alt="F2L"></span>
      <span>
        <h2>F2L<span class="n">39</span></h2>
        <p>红 / 绿为 F 面</p>
      </span>
    </a>
    <a class="card" href="oll.html">
      <span class="thumb"><img src="oll/oll-01-512x512.png" alt="OLL"></span>
      <span>
        <h2>OLL<span class="n">57</span></h2>
        <p>十字 · 单点 · 一字 · 拐角</p>
      </span>
    </a>
    <a class="card" href="pll.html">
      <span class="thumb"><img src="pll/pll-Aa-512x512.png" alt="PLL"></span>
      <span>
        <h2>PLL<span class="n">21</span></h2>
        <p>带侧面色带与置换箭头</p>
      </span>
    </a>
  </div>
</main>

<script src="nav.js"></script>
<script>
(function () {
  'use strict';
  var root = document.documentElement, btn = document.getElementById('themebtn');
  function applyTheme(t) {
    root.dataset.theme = t;
    btn.textContent = t === 'dark' ? '\u2600' : '\u263e';
    btn.title = t === 'dark' ? '切到白天' : '切到夜晚';
    try { localStorage.setItem('cube-theme', t); } catch (e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem('cube-theme'); } catch (e) {}
  applyTheme(saved === 'dark' ? 'dark' : 'light');
  btn.addEventListener('click', function () {
    applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
